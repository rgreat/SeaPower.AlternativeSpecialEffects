help.Effects/FireFlicker = The light of a fire on a ship flickers, deeper and faster the stronger the fire (small / moderate / severe).
help.Effects/FireLightPower = Brightness of the fire light on ships (the game's own fire light multiplied; its range grows too). 1 = the game's.
help.Effects/MuzzleFlashLight = A short light flash at the muzzle when guns, CIWS and machine guns fire (visible at night).
help.Effects/MissileLaunchFlashLight = A light follows a missile for as long as its booster burns after launch (the booster burn time of the missile).
help.Effects/HitFlashLight = A short light flash where a gun shell hits (not in the water).
help.Effects/DayBrightness = Brightness of the flashes and of the fire light by day, 1 = no dimming. In full sun the lights are multiplied by this (at night they are not changed): the sun and a bright light add up and blow out into white and pink.
help.Effects/FlashPower = Brightness and size of the flashes, 1 = default.
help.Effects/FlashLimit = All the flashes alive at once share a total brightness limit, so many hits together do not over-expose the picture.
help.Effects/ExtraSmokeEmitters = Number of fire and smoke points by ship length instead of the game's three: under 25 m 1, under 50 m 2, under 75 m 3, from 75 m 5 (one per section, each showing its own section's fire). Ships spawned from now on.
help.Effects/SmokeBySeverity = Fire looks by the fire's strength (share of its maximum) instead of the game's stages: small, moderate from SmokeModerateFrom, severe from SmokeSevereFrom (the game: 25% / 50%); the small fire's smoke grows from SmokeStartOpacity to SmokeEndOpacity. Only the look - damage and spreading stay the game's. Off = as in the game.
help.Effects/SmokeStartOpacity = Small fire: smoke opacity of new particles at 0% of the fire's maximum, % of the game's.
help.Effects/SmokeEndOpacity = Small fire: smoke opacity of new particles at SmokeModerateFrom, % of the game's; between - evenly by the fire's strength.
help.Effects/SmokeModerateFrom = The moderate fire's look from this strength, % of the fire's maximum (the game: 25%).
help.Effects/SmokeSevereFrom = The severe fire's look from this strength, % of the fire's maximum (the game: 50%).
help.Effects/BubblesStopMinutes = Minutes (game time, so time compression counts) after a ship starts to sink, when its sinking-bubbles effect stops emitting (the game never stops it while the wreck exists). Saves resources in long missions. 0 = never, as in the game.
help.UI/HideUnobservedTargets3D = Do not draw in the 3D view the targets of other sides that are not observed visually (known by radar, sonar or data only). Your own units are always drawn.
help.Optics/BinocularsNormalView = Binoculars at the maximum magnification start with the normal view (the game starts them with its night / thermal filter on). The game's filter key switches the filter on.
help.Optics/NormalViewDayOnly = The normal view is the default only by day; at night the game's own default filter stays.
help.Guns/MachineGunBurstFix = Machine guns show their muzzle burst on every shot: a pooled burst effect that is still playing is restarted.
help.Guns/MachineGunSoundLoopFix = The looped fire sound of machine guns skips the silent part of its clip (a gap in the middle of a long burst).
help.Guns/HitSoundFix = Gun hits always play their explosion sound: an effect whose sound did not start (pooled instance) is made to play it.
help.General/Debug = Verbose logging and BepInEx/AlternativeWeaponsControl.trace.txt.
help.General/Language = Language of the mod's texts: a code of a game language (en, ru ...); empty = the game's own language. The texts are in the files lang/<code>.ini in the mod folder - edit them to translate.
