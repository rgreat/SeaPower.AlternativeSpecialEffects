help.FunnelSmoke/PowerExponent = Quantité de fumée selon la puissance des moteurs : × (chevaux / PowerReference) ^ cette valeur, limitée à 1..2 : un petit navire garde la quantité du jeu, un grand en obtient jusqu'au double. 0 = la quantité du jeu pour tous les navires.
help.FunnelSmoke/PowerReference = La puissance en chevaux à laquelle la quantité de fumée est celle du groupe (non modifiée par PowerExponent).
