lbl.Effects/SmokeAfterClouds = Fumée et nuages dans le bon ordre
help.Effects/SmokeAfterClouds = La fumée (incendies et cheminées) et les nuages se superposent dans le bon ordre : avant chaque image, chaque colonne de fumée est placée devant ou derrière les nuages selon la position de la couche de nuages sur la ligne entre la caméra et elle (le jeu trie une cellule de nuages entière, large de plusieurs kilomètres, par son centre, si bien que des nuages situés derrière un navire pouvaient masquer sa fumée). Désactivé = comme dans le jeu.
lbl.Effects/SmokeKeepOnStop = Conserver la fumée en cours quand le stade du feu change
help.Effects/SmokeKeepOnStop = Quand un feu change de stade ou s'éteint, la fumée déjà dans l'air reste et se dissipe ; seules les nouvelles particules s'arrêtent. Désactivé = le jeu l'efface aussitôt.
