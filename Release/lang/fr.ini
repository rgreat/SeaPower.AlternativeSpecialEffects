help.Effects/FireFlicker = La lumière d'un incendie sur un navire scintille, plus profondément et plus vite quand l'incendie est plus fort (petit / moyen / grave).
help.Effects/FireLightPower = Luminosité de la lumière des incendies sur les navires (la lumière d'incendie du jeu, multipliée ; sa portée augmente aussi). 1 = celle du jeu.
help.Effects/MuzzleFlashLight = Un bref flash lumineux à la bouche quand les canons, CIWS et mitrailleuses tirent (visible la nuit).
help.Effects/MissileLaunchFlashLight = Une lumière suit un missile tant que son booster brûle après le lancement (la durée de combustion du booster du missile).
help.Effects/HitFlashLight = Un bref flash lumineux là où un obus touche (pas dans l'eau).
help.Effects/DayBrightness = Luminosité des éclairs et de la lumière des incendies de jour, 1 = sans atténuation. En plein soleil les lumières sont multipliées par cette valeur (inchangées la nuit) : le soleil et une lumière vive s’additionnent et saturent en blanc et rose.
help.Effects/FlashPower = Luminosité et taille des flashs, 1 = par défaut.
help.Effects/FlashLimit = Les canons, CIWS et mitrailleuses du joueur tournent et s'élèvent vers une cible au-delà de leur portée maximale (jusqu'à 1,5 x la portée, au moins 5 nm) sans tirer, comme si elle était à la portée maximale. Désactivé = comme dans le jeu : la tourelle reste immobile tant que la cible n'est pas à portée.
help.Effects/ExtraSmokeEmitters = Number of fire and smoke points by ship length instead of the game's three: under 25 m 1, under 50 m 2, under 75 m 3, from 75 m 5 (one per section, each showing its own section's fire). Ships spawned from now on.
help.Effects/SmokeBySeverity = Fire looks by the fire's strength (share of its maximum) instead of the game's stages: small, moderate from SmokeModerateFrom, severe from SmokeSevereFrom (the game: 25% / 50%); the small fire's smoke grows from SmokeStartOpacity to SmokeEndOpacity. Only the look - damage and spreading stay the game's. Off = as in the game.
help.Effects/SmokeStartOpacity = Small fire: smoke opacity of new particles at 0% of the fire's maximum, % of the game's.
help.Effects/SmokeEndOpacity = Small fire: smoke opacity of new particles at SmokeModerateFrom, % of the game's; between - evenly by the fire's strength.
help.Effects/SmokeModerateFrom = The moderate fire's look from this strength, % of the fire's maximum (the game: 25%).
help.Effects/SmokeSevereFrom = The severe fire's look from this strength, % of the fire's maximum (the game: 50%).
help.Effects/BubblesStopMinutes = Minutes (game time, so time compression counts) after a ship starts to sink, when its sinking-bubbles effect stops emitting (the game never stops it while the wreck exists). Saves resources in long missions. 0 = never, as in the game.
help.UI/HideUnobservedTargets3D = Do not draw in the 3D view the targets of other sides that are not observed visually (known by radar, sonar or data only). Your own units are always drawn.
help.Optics/BinocularsNormalView = Les jumelles au grossissement maximal démarrent en vue normale (le jeu les démarre avec son filtre nocturne / thermique). La touche de filtre du jeu active le filtre.
help.Optics/NormalViewDayOnly = La vue normale est la vue par défaut seulement de jour ; la nuit, le filtre par défaut du jeu reste.
help.Guns/MachineGunBurstFix = Les mitrailleuses montrent leur flamme de bouche à chaque tir : un effet de flamme du pool encore en cours est relancé.
help.Guns/MachineGunSoundLoopFix = Le son de tir en boucle des mitrailleuses saute la partie silencieuse de son clip (un trou au milieu d'une longue rafale).
help.Guns/HitSoundFix = Les impacts de canon jouent toujours leur son d'explosion : un effet dont le son n'a pas démarré (instance du pool) est forcé à le jouer.
help.General/Debug = Journalisation détaillée et BepInEx/AlternativeWeaponsControl.trace.txt.
help.General/Language = Langue des textes du mod : un code de langue du jeu (en, ru ...) ; vide = la langue propre du jeu. Les textes sont dans les fichiers lang/<code>.ini du dossier du mod - modifiez-les pour traduire.
