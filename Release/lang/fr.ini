unit.x = x
help.Effects/FireFlicker = La lumière d'un incendie sur un navire scintille, plus profondément et plus vite quand l'incendie est plus fort (petit / moyen / grave).
help.Effects/FireLightPower = Luminosité de la lumière des incendies sur les navires (la lumière d'incendie du jeu, multipliée ; sa portée augmente aussi). 1 = celle du jeu.
help.Effects/MuzzleFlashLight = Un bref flash lumineux à la bouche quand les canons, CIWS et mitrailleuses tirent (visible la nuit).
help.Effects/MissileLaunchFlashLight = Une lumière suit un missile tant que son booster brûle après le lancement (la durée de combustion du booster du missile).
help.Effects/HitFlashLight = Un bref flash lumineux là où un obus touche (pas dans l'eau).
help.Effects/DayBrightness = Luminosité des éclairs et de la lumière des incendies de jour, 1 = sans atténuation. En plein soleil les lumières sont multipliées par cette valeur (inchangées la nuit) : le soleil et une lumière vive s’additionnent et saturent en blanc et rose.
help.Effects/FlashPower = Luminosité et taille des flashs, 1 = par défaut.
help.Effects/FlashLimit = Les canons, CIWS et mitrailleuses du joueur tournent et s'élèvent vers une cible au-delà de leur portée maximale (jusqu'à 1,5 x la portée, au moins 5 nm) sans tirer, comme si elle était à la portée maximale. Désactivé = comme dans le jeu : la tourelle reste immobile tant que la cible n'est pas à portée.
help.Effects/ExtraSmokeEmitters = Nombre de points de feu et de fumée selon la longueur du navire au lieu des trois du jeu : moins de 25 m 1, moins de 50 m 2, moins de 75 m 3, à partir de 75 m 5 (un par section, chacun montrant le feu de sa section). Pour les navires créés à partir de maintenant.
help.Effects/SmokeBySeverity = L'aspect du feu dépend de son intensité (part de son maximum) au lieu des stades du jeu : petit, modéré à partir de SmokeModerateFrom, violent à partir de SmokeSevereFrom (le jeu : 25 % / 50 %) ; la fumée du petit feu passe de SmokeStartOpacity à SmokeEndOpacity. Seul l'aspect change : dégâts et propagation restent ceux du jeu. Désactivé = comme dans le jeu.
help.Effects/SmokeStartOpacity = Petit feu : opacité de la fumée des nouvelles particules à 0 % du maximum du feu, % de la valeur du jeu.
help.Effects/SmokeEndOpacity = Petit feu : opacité de la fumée des nouvelles particules à SmokeModerateFrom, % de la valeur du jeu ; entre les deux, de façon régulière selon l'intensité du feu.
help.Effects/SmokeModerateFrom = L'aspect du feu modéré à partir de cette intensité, % du maximum du feu (le jeu : 25 %).
help.Effects/SmokeSevereFrom = L'aspect du feu violent à partir de cette intensité, % du maximum du feu (le jeu : 50 %).
help.Effects/SmokeSortFix = Les colonnes de fumée d'un même navire se superposent dans le bon ordre : chaque système de fumée est trié selon la distance à son point de feu, et non au centre de ses limites (le centre d'un panache haut est très haut). Désactivé = comme dans le jeu.
help.Effects/SmokeDensityFactor = Densité du feu et de la fumée des navires : le nombre de particules émises est multiplié par cette valeur (1 = comme dans le jeu ; 2 par défaut). Rien d'autre ne change.
help.Effects/SmokeLifetimeFactor = La fumée des incendies de navires dure autant de fois plus longtemps avant de s'éclaircir (1 = comme dans le jeu).
help.FunnelSmoke/Enabled = La fumée de cheminée des navires suit le type de moteur et la charge : sa densité, sa luminosité et son épaisseur sont définies par les groupes ci-dessous (Diesel, Steam, GasTurbine, Nuclear, Combined). Le groupe d'un navire est son système de propulsion en service ; funnel_groups.txt (à côté de la dll) force un navire dans un autre groupe. Désactivé = comme dans le jeu.
help.FunnelSmoke/GlobalThickness = Épaisseur (opacité des particules) de la fumée de cheminée de tous les navires, × la valeur du jeu ; les valeurs propres des groupes sont multipliées par celle-ci. Ne coûte aucune performance.
help.FunnelSmoke/GlobalDensity = Nombre de particules de fumée de cheminée de tous les navires, × la valeur du jeu ; les valeurs propres des groupes sont multipliées par celle-ci. Plus de particules coûtent des performances : préférez GlobalThickness.
help.FunnelSmoke/DieselDensityIdle = Quantité de particules de fumée de cheminée de ce groupe à basse vitesse, × la valeur du jeu.
help.FunnelSmoke/DieselDensityFull = Quantité de particules de fumée de cheminée de ce groupe à pleine puissance, × la valeur du jeu ; entre les deux, de façon régulière selon la vitesse (un navire qui accélère compte comme à pleine puissance).
help.FunnelSmoke/DieselLightIdle = Luminosité de la fumée de cheminée de ce groupe à basse vitesse, % : 0 = noir, 100 = blanc (un gris neutre ; la fumée du jeu est brun foncé).
help.FunnelSmoke/DieselLightFull = Luminosité de la fumée de cheminée de ce groupe à pleine vitesse, % : 0 = noir, 100 = blanc.
help.FunnelSmoke/DieselThicknessIdle = Épaisseur de la fumée de cheminée de ce groupe à basse vitesse (sa densité apparente), × la valeur du jeu ; au-dessus de 1 elle est plus dense.
help.FunnelSmoke/DieselThicknessFull = Épaisseur de la fumée de cheminée de ce groupe à pleine vitesse (sa densité apparente), × la valeur du jeu ; entre les deux, de façon régulière selon la vitesse.
help.FunnelSmoke/DieselLifeIdle = Durée de la fumée de cheminée de ce groupe à basse vitesse, × la valeur du jeu (la durée de vie de ses particules ; le panache s'allonge aussi). Seules les nouvelles particules changent.
help.FunnelSmoke/DieselLifeFull = Durée de la fumée de cheminée de ce groupe à pleine vitesse, × la valeur du jeu ; entre les deux, de façon régulière selon la vitesse. Seules les nouvelles particules changent.
help.FunnelSmoke/SteamDensityIdle = Quantité de particules de fumée de cheminée de ce groupe à basse vitesse, × la valeur du jeu.
help.FunnelSmoke/SteamDensityFull = Quantité de particules de fumée de cheminée de ce groupe à pleine puissance, × la valeur du jeu ; entre les deux, de façon régulière selon la vitesse (un navire qui accélère compte comme à pleine puissance).
help.FunnelSmoke/SteamLightIdle = Luminosité de la fumée de cheminée de ce groupe à basse vitesse, % : 0 = noir, 100 = blanc (un gris neutre ; la fumée du jeu est brun foncé).
help.FunnelSmoke/SteamLightFull = Luminosité de la fumée de cheminée de ce groupe à pleine vitesse, % : 0 = noir, 100 = blanc.
help.FunnelSmoke/SteamThicknessIdle = Épaisseur de la fumée de cheminée de ce groupe à basse vitesse (sa densité apparente), × la valeur du jeu ; au-dessus de 1 elle est plus dense.
help.FunnelSmoke/SteamThicknessFull = Épaisseur de la fumée de cheminée de ce groupe à pleine vitesse (sa densité apparente), × la valeur du jeu ; entre les deux, de façon régulière selon la vitesse.
help.FunnelSmoke/SteamLifeIdle = Durée de la fumée de cheminée de ce groupe à basse vitesse, × la valeur du jeu (la durée de vie de ses particules ; le panache s'allonge aussi). Seules les nouvelles particules changent.
help.FunnelSmoke/SteamLifeFull = Durée de la fumée de cheminée de ce groupe à pleine vitesse, × la valeur du jeu ; entre les deux, de façon régulière selon la vitesse. Seules les nouvelles particules changent.
help.FunnelSmoke/GasTurbineDensityIdle = Quantité de particules de fumée de cheminée de ce groupe à basse vitesse, × la valeur du jeu.
help.FunnelSmoke/GasTurbineDensityFull = Quantité de particules de fumée de cheminée de ce groupe à pleine puissance, × la valeur du jeu ; entre les deux, de façon régulière selon la vitesse (un navire qui accélère compte comme à pleine puissance).
help.FunnelSmoke/GasTurbineLightIdle = Luminosité de la fumée de cheminée de ce groupe à basse vitesse, % : 0 = noir, 100 = blanc (un gris neutre ; la fumée du jeu est brun foncé).
