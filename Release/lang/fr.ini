help.FunnelSmoke/NuclearThicknessFull = Épaisseur de la fumée de cheminée de ce groupe à pleine vitesse (sa densité apparente), × la valeur du jeu ; entre les deux, de façon régulière selon la vitesse.
help.FunnelSmoke/NuclearLifeIdle = Durée de la fumée de cheminée de ce groupe à basse vitesse, × la valeur du jeu (la durée de vie de ses particules ; le panache s'allonge aussi). Seules les nouvelles particules changent.
help.FunnelSmoke/NuclearLifeFull = Durée de la fumée de cheminée de ce groupe à pleine vitesse, × la valeur du jeu ; entre les deux, de façon régulière selon la vitesse. Seules les nouvelles particules changent.
help.FunnelSmoke/CombinedDensityIdle = Quantité de particules de fumée de cheminée de ce groupe à basse vitesse, × la valeur du jeu.
help.FunnelSmoke/CombinedDensityFull = Quantité de particules de fumée de cheminée de ce groupe à pleine puissance, × la valeur du jeu ; entre les deux, de façon régulière selon la vitesse (un navire qui accélère compte comme à pleine puissance).
help.FunnelSmoke/CombinedLightIdle = Luminosité de la fumée de cheminée de ce groupe à basse vitesse, % : 0 = noir, 100 = blanc (un gris neutre ; la fumée du jeu est brun foncé).
help.FunnelSmoke/CombinedLightFull = Luminosité de la fumée de cheminée de ce groupe à pleine vitesse, % : 0 = noir, 100 = blanc.
help.FunnelSmoke/CombinedThicknessIdle = Épaisseur de la fumée de cheminée de ce groupe à basse vitesse (sa densité apparente), × la valeur du jeu ; au-dessus de 1 elle est plus dense.
help.FunnelSmoke/CombinedThicknessFull = Épaisseur de la fumée de cheminée de ce groupe à pleine vitesse (sa densité apparente), × la valeur du jeu ; entre les deux, de façon régulière selon la vitesse.
help.FunnelSmoke/CombinedLifeIdle = Durée de la fumée de cheminée de ce groupe à basse vitesse, × la valeur du jeu (la durée de vie de ses particules ; le panache s'allonge aussi). Seules les nouvelles particules changent.
help.FunnelSmoke/CombinedLifeFull = Durée de la fumée de cheminée de ce groupe à pleine vitesse, × la valeur du jeu ; entre les deux, de façon régulière selon la vitesse. Seules les nouvelles particules changent.
help.Effects/SmokeFireShare = Animation du sprite du feu des navires : la première partie (% de sa longueur) contient les flammes et garde la vitesse du jeu ; seul le reste (fumée) est ralenti par SmokeLifetimeFactor.
help.Effects/SmokeSpreadGrowth = Fumée des incendies de navires : sur la partie ralentie de la vie d'une particule, son sprite grossit, en % de l'écart supplémentaire entre les sprites par rapport au jeu (0 = la taille du jeu ; 100 = proportionnel).
help.Effects/SmokeSpreadFade = Fumée des incendies de navires : les sprites qui grossissent deviennent plus transparents, % (100 = l'opacité baisse quand la taille augmente ; 0 = l'opacité du jeu).
help.Effects/GunHitEffects = Impacts d'obus de canon plus visibles et spectaculaires : selon sa masse, chaque obus reçoit l'une de 10 classes, chacune avec sa propre collection d'effets d'impact sur un navire, dans l'air, sur l'eau et sur le sol, et une échelle pour chacun. Désactivé = les effets d'impact du jeu. Effet immédiat ; un obus déjà en l'air garde l'effet qu'il avait. Les classes se règlent dans l'onglet Canons.
help.Effects/LifeRaftLights = Un feu rouge clignotant sur les radeaux de sauvetage (visible de nuit). Désactivé = radeaux sans feux. Effet immédiat.
help.Effects/BubblesStopMinutes = Minutes (temps de jeu, la compression du temps compte) après le début du naufrage d'un navire, au bout desquelles son effet de bulles cesse d'émettre (le jeu ne l'arrête jamais tant que l'épave existe). Économise des ressources dans les longues missions. 0 = jamais, comme dans le jeu.
help.UI/HideUnobservedTargets3D = Ne dessine pas dans la vue 3D les cibles des autres camps qui ne sont pas observées visuellement (connues seulement par radar, sonar ou données). Vos propres unités sont toujours dessinées. Sans effet tant que les triches « Show Unidentified » ou « Control Enemy Units » du menu F10 sont activées.
help.UI/HideUnobservedSubmarines3D = Quand le masquage des cibles non observées est activé, les sous-marins sont aussi masqués. Désactivé : les sous-marins sont toujours dessinés (on ne les voit presque jamais à vue). N'a d'effet que si « Masquer les cibles non vues en 3D » est activé.
help.Effects/ColourGradingNoDepthMask = L'étalonnage du jeu dépend de la profondeur derrière un pixel ; la fumée n'a pas de profondeur propre, elle changeait donc brusquement de couleur à l'horizon (brun sur la mer, gris sur le ciel). Activé : le même étalonnage partout. Désactivé = comme dans le jeu.
help.Guns/MachineGunBurstFix = Les mitrailleuses montrent leur flamme de bouche à chaque tir : un effet de flamme du pool encore en cours est relancé.
help.Guns/MachineGunSoundLoopFix = Le son de tir en boucle des mitrailleuses saute la partie silencieuse de son clip (un trou au milieu d'une longue rafale).
help.Guns/HitSoundFix = Les impacts de canon jouent toujours leur son d'explosion : un effet dont le son n'a pas démarré (instance du pool) est forcé à le jouer.
help.General/Debug = Journalisation détaillée et BepInEx/AlternativeWeaponsControl.trace.txt.
help.Debug/CamOffColor = Débogage pour trouver ce qui change la couleur de la fumée à l'horizon : désactive cet effet de caméra du jeu tant qu'il est activé. Non enregistré dans les options du jeu.
help.Debug/CamOffUnderwater = Débogage pour trouver ce qui change la couleur de la fumée à l'horizon : désactive cet effet de caméra du jeu tant qu'il est activé. Non enregistré dans les options du jeu.
help.Debug/CamOffOcclusion = Débogage pour trouver ce qui change la couleur de la fumée à l'horizon : désactive cet effet de caméra du jeu tant qu'il est activé. Non enregistré dans les options du jeu.
help.Debug/CamOffBloom = Débogage pour trouver ce qui change la couleur de la fumée à l'horizon : désactive cet effet de caméra du jeu tant qu'il est activé. Non enregistré dans les options du jeu.
help.General/Language = Langue des textes du mod : un code de langue du jeu (en, ru ...) ; vide = la langue propre du jeu. Les textes sont dans les fichiers lang/<code>.ini du dossier du mod - modifiez-les pour traduire.
