help.FunnelSmoke/Nations = Pays (le Nation= du ini du navire) : multiplicateurs des valeurs du groupe pour la fumée de cheminée de tous les navires du pays : quantité de particules, durée (vie), luminosité et épaisseur ; 1 = valeur du groupe. Les valeurs propres d'un navire (onglet Navires) s'y multiplient en plus.
