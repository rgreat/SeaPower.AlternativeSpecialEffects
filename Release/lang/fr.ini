help.FunnelSmoke/NuclearDensityFull = Quantité de particules de fumée de cheminée de ce groupe à pleine puissance, × la valeur du jeu ; entre les deux, de façon régulière selon la vitesse (un navire qui accélère compte comme à pleine puissance).
