help.Effects/FireFlicker = Ánh sáng đám cháy trên tàu nhấp nháy, sâu và nhanh hơn khi đám cháy mạnh hơn (nhỏ / vừa / nặng).
help.Effects/FireLightPower = Độ sáng ánh sáng đám cháy trên tàu (ánh sáng cháy riêng của trò chơi được nhân lên; tầm của nó cũng tăng). 1 = như trò chơi.
help.Effects/MuzzleFlashLight = Một chớp sáng ngắn ở nòng khi pháo, CIWS và súng máy bắn (thấy được ban đêm).
help.Effects/MissileLaunchFlashLight = Một ánh sáng đi theo tên lửa trong lúc bộ đẩy của nó cháy sau khi phóng (thời gian cháy bộ đẩy của tên lửa).
help.Effects/HitFlashLight = Một chớp sáng ngắn nơi đạn pháo trúng (không phải dưới nước).
help.Effects/DayBrightness = Độ sáng của chớp sáng và ánh lửa cháy ban ngày, 1 = không giảm. Dưới nắng gắt ánh sáng được nhân với giá trị này (ban đêm không đổi): nắng và ánh sáng mạnh cộng lại sẽ cháy thành màu trắng và hồng.
help.Effects/FlashPower = Độ sáng và kích thước chớp sáng, 1 = mặc định.
help.Effects/FlashLimit = Pháo, CIWS và súng máy của người chơi quay và nâng về phía mục tiêu ngoài tầm bắn tối đa (tới 1,5 x tầm, ít nhất 5 hl) mà không bắn, như thể nó ở tầm tối đa. Tắt = như trong trò chơi: tháp pháo đứng yên cho đến khi mục tiêu vào tầm.
help.Effects/ExtraSmokeEmitters = Số điểm lửa và khói theo chiều dài tàu thay cho ba điểm của game: dưới 25 m là 1, dưới 50 m là 2, dưới 75 m là 3, từ 75 m là 5 (mỗi khoang một điểm, mỗi điểm hiển thị đám cháy của khoang mình). Áp dụng cho tàu xuất hiện từ bây giờ.
help.Effects/SmokeBySeverity = Hình dạng đám cháy được quyết định theo cường độ (tỉ lệ so với mức tối đa) thay vì các giai đoạn của game: nhỏ, vừa từ SmokeModerateFrom, nặng từ SmokeSevereFrom (game: 25% / 50%); khói của đám cháy nhỏ tăng từ SmokeStartOpacity đến SmokeEndOpacity. Chỉ đổi hình dạng — sát thương và sự lan rộng vẫn như game. Tắt = như trong game.
help.Effects/SmokeStartOpacity = Đám cháy nhỏ: độ mờ đục của khói hạt mới ở mức 0% tối đa của đám cháy, % giá trị của game.
help.Effects/SmokeEndOpacity = Đám cháy nhỏ: độ mờ đục của khói hạt mới tại SmokeModerateFrom, % giá trị của game; ở giữa thay đổi đều theo cường độ đám cháy.
help.Effects/SmokeModerateFrom = Hình dạng đám cháy vừa kể từ cường độ này, % mức tối đa của đám cháy (game: 25%).
help.Effects/SmokeSevereFrom = Hình dạng đám cháy nặng kể từ cường độ này, % mức tối đa của đám cháy (game: 50%).
help.Effects/SmokeSortFix = Các cột khói của một tàu chồng lên nhau đúng thứ tự: mỗi hệ thống khói được sắp xếp theo khoảng cách đến điểm cháy của nó, không phải đến tâm khung bao (tâm của cột khói cao nằm rất cao). Tắt = như trong game.
help.Effects/SmokeDensityFactor = Mật độ lửa và khói của tàu: số hạt chúng phát ra được nhân với giá trị này (1 = như trong game; mặc định 2). Không có gì khác thay đổi.
help.Effects/SmokeLifetimeFactor = Khói cháy trên tàu kéo dài gấp bấy nhiêu lần trước khi mỏng đi (1 = như trong game).
help.FunnelSmoke/Enabled = Khói ống khói của tàu thay đổi theo loại động cơ và tải: mật độ, độ sáng và độ dày đặc do các nhóm bên dưới quy định (Diesel, Steam, GasTurbine, Nuclear, Combined). Nhóm của tàu là hệ động lực đang dùng; funnel_groups.txt (cạnh dll) ép một tàu vào nhóm khác. Tắt = như trong game.
help.FunnelSmoke/GlobalThickness = Độ dày đặc (độ mờ đục của hạt) của khói ống khói của mọi tàu, nhân với giá trị của game; giá trị riêng của các nhóm được nhân với giá trị này. Không tốn hiệu năng.
help.FunnelSmoke/GlobalDensity = Số hạt khói ống khói của mọi tàu, nhân với giá trị của game; giá trị riêng của các nhóm được nhân với giá trị này. Nhiều hạt hơn tốn hiệu năng: nên dùng GlobalThickness.
help.FunnelSmoke/DieselDensityIdle = Lượng hạt khói ống khói của nhóm này khi chạy chậm, nhân với giá trị của game.
help.FunnelSmoke/DieselDensityFull = Lượng hạt khói ống khói của nhóm này khi hết công suất, nhân với giá trị của game; ở giữa thì thay đổi đều theo tốc độ (tàu đang tăng tốc được tính như hết công suất).
help.FunnelSmoke/DieselLightIdle = Độ sáng của khói ống khói của nhóm này khi chạy chậm, %: 0 = đen, 100 = trắng (xám trung tính; khói của game có màu nâu sẫm).
