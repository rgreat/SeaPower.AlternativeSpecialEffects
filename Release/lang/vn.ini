help.Effects/SmokeFireShare = Hoạt ảnh sprite đám cháy trên tàu: phần đầu (% chiều dài) chứa ngọn lửa và giữ tốc độ của game; chỉ phần còn lại (khói) bị làm chậm bởi SmokeLifetimeFactor.
help.Effects/SmokeSpreadGrowth = Khói cháy trên tàu: ở phần vòng đời bị làm chậm của hạt, sprite của nó phình to, tính bằng % mức sprite bay xa hơn so với game (0 = kích thước của game; 100 = tỉ lệ thuận).
help.Effects/SmokeSpreadFade = Khói cháy trên tàu: các sprite phình to trở nên trong suốt hơn, % (100 = độ mờ đục giảm khi kích thước tăng; 0 = độ mờ đục của game).
help.Effects/GunHitEffects = Các cú trúng đạn pháo dễ thấy và ngoạn mục hơn: theo khối lượng, mỗi viên đạn được xếp vào một trong 10 lớp, mỗi lớp có bộ hiệu ứng trúng riêng lên tàu, trong không khí, trên mặt nước và trên mặt đất, cùng một tỉ lệ cho từng loại. Tắt = hiệu ứng trúng của game. Có hiệu lực ngay; viên đạn đang bay giữ nguyên hiệu ứng cũ. Các lớp được đặt trong tab Pháo.
help.Effects/LifeRaftLights = Đèn đỏ nhấp nháy trên bè cứu sinh (thấy được vào ban đêm). Tắt = bè không có đèn. Có hiệu lực ngay.
help.Effects/BubblesStopMinutes = Số phút (thời gian trong game, nên nén thời gian cũng được tính) sau khi tàu bắt đầu chìm thì hiệu ứng bọt chìm ngừng phát ra (game không bao giờ dừng nó khi xác tàu còn tồn tại). Tiết kiệm tài nguyên trong nhiệm vụ dài. 0 = không bao giờ, như trong game.
help.UI/HideUnobservedTargets3D = Không vẽ trong chế độ xem 3D các mục tiêu của phe khác không được quan sát bằng mắt (chỉ biết qua radar, sonar hoặc dữ liệu). Đơn vị của bạn luôn được vẽ. Không áp dụng khi các công tắc gian lận của menu F10 «Show Unidentified» hoặc «Control Enemy Units» đang bật.
help.UI/HideUnobservedSubmarines3D = Khi bật ẩn mục tiêu không quan sát được, tàu ngầm cũng bị ẩn. Tắt: tàu ngầm luôn được vẽ (hầu như không bao giờ nhìn thấy bằng mắt). Chỉ có tác dụng khi «Ẩn mục tiêu không nhìn thấy trong 3D» đang bật.
help.Effects/ColourGradingNoDepthMask = Chỉnh màu của game phụ thuộc vào độ sâu phía sau điểm ảnh; khói không có độ sâu riêng nên đổi màu đột ngột ở đường chân trời (nâu trên biển, xám trên trời). Bật: dùng cùng một cách chỉnh màu ở mọi nơi. Tắt = như trong game.
help.Guns/MachineGunBurstFix = Súng máy hiển thị chớp lửa nòng ở mỗi phát bắn: hiệu ứng chớp lửa trong nhóm vẫn đang chạy sẽ được khởi động lại.
help.Guns/MachineGunSoundLoopFix = Tiếng bắn lặp của súng máy bỏ qua phần im lặng của đoạn âm thanh (khoảng trống giữa một loạt bắn dài).
help.Guns/HitSoundFix = Pháo trúng đích luôn phát tiếng nổ: hiệu ứng mà âm thanh chưa bắt đầu (thực thể trong nhóm) được buộc phát.
help.General/Debug = Ghi nhật ký chi tiết và BepInEx/AlternativeWeaponsControl.trace.txt.
help.Debug/CamOffColor = Gỡ lỗi để tìm cái gì làm đổi màu khói ở đường chân trời: khi bật sẽ tắt hiệu ứng camera này của game. Không lưu vào tùy chọn của game.
help.Debug/CamOffUnderwater = Gỡ lỗi để tìm cái gì làm đổi màu khói ở đường chân trời: khi bật sẽ tắt hiệu ứng camera này của game. Không lưu vào tùy chọn của game.
