help.FunnelSmoke/Nations = Quốc gia (Nation= trong ini của tàu): hệ số nhân áp lên giá trị của nhóm cho khói ống khói của mọi tàu thuộc quốc gia đó: lượng hạt, thời lượng (vòng đời), độ sáng và độ dày đặc; 1 = giá trị của nhóm. Giá trị riêng của tàu (trang Tàu) được nhân thêm lên trên.
