help.Effects/SmokeAfterClouds = Khói (đám cháy và ống khói) và mây chồng lên nhau đúng thứ tự: trước mỗi khung hình, mỗi cột khói được đặt trước hoặc sau mây tùy vị trí lớp mây trên đường từ camera đến nó (game sắp xếp cả ô mây rộng hàng km theo tâm của nó, nên mây phía sau tàu có thể che khói của tàu). Tắt = như trong game.
lbl.Effects/SmokeKeepOnStop = Giữ khói đang bay khi giai đoạn cháy thay đổi
help.Effects/SmokeKeepOnStop = Khi đám cháy đổi giai đoạn hoặc tắt, khói đã bay trong không khí vẫn còn và tan dần; chỉ các hạt mới dừng lại. Tắt = game xóa khói ngay lập tức.
