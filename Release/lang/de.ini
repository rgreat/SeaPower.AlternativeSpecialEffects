help.FunnelSmoke/CombinedDensityFull = Menge der Schornsteinrauch-Partikel dieser Gruppe bei voller Leistung, × des Spielwerts; dazwischen gleichmäßig nach Geschwindigkeit (ein beschleunigendes Schiff zählt als bei voller Leistung).
help.FunnelSmoke/CombinedLightIdle = Helligkeit des Schornsteinrauchs dieser Gruppe bei niedriger Geschwindigkeit, %: 0 = schwarz, 100 = weiß (ein neutrales Grau; der Rauch des Spiels ist dunkel bräunlich).
help.FunnelSmoke/CombinedLightFull = Helligkeit des Schornsteinrauchs dieser Gruppe bei voller Geschwindigkeit, %: 0 = schwarz, 100 = weiß.
help.FunnelSmoke/CombinedThicknessIdle = Dichte des Schornsteinrauchs dieser Gruppe bei niedriger Geschwindigkeit (wie dicht er wirkt), × des Spielwerts; über 1 wird er dichter.
help.FunnelSmoke/CombinedThicknessFull = Dichte des Schornsteinrauchs dieser Gruppe bei voller Geschwindigkeit (wie dicht er wirkt), × des Spielwerts; dazwischen gleichmäßig nach Geschwindigkeit.
help.FunnelSmoke/CombinedLifeIdle = Wie lange der Schornsteinrauch dieser Gruppe bei niedriger Geschwindigkeit bleibt, × des Spielwerts (die Lebensdauer seiner Partikel; die Fahne wird dadurch auch länger). Nur neue Partikel ändern sich.
help.FunnelSmoke/CombinedLifeFull = Wie lange der Schornsteinrauch dieser Gruppe bei voller Geschwindigkeit bleibt, × des Spielwerts; dazwischen gleichmäßig nach Geschwindigkeit. Nur neue Partikel ändern sich.
help.Effects/SmokeFireShare = Sprite-Animation des Schiffsbrandes: Der erste Teil (% der Länge) enthält die Flammen und behält die Geschwindigkeit des Spiels; nur der Rest (Rauch) wird durch SmokeLifetimeFactor verlangsamt.
help.Effects/SmokeSpreadGrowth = Rauch von Schiffsbränden: Im verlangsamten Teil der Lebensdauer eines Partikels wächst sein Sprite, in % davon, wie viel weiter die Sprites auseinanderfliegen als im Spiel (0 = Größe des Spiels; 100 = proportional).
help.Effects/SmokeSpreadFade = Rauch von Schiffsbränden: Die wachsenden Sprites werden durchsichtiger, % (100 = die Deckkraft sinkt mit wachsender Größe; 0 = Deckkraft des Spiels).
help.Effects/GunHitEffects = Sichtbarere, spektakulärere Treffer von Geschützgranaten: Nach ihrer Masse erhält jede Granate eine von 10 Klassen, jede mit eigener Sammlung von Treffereffekten auf einem Schiff, in der Luft, auf dem Wasser und am Boden sowie einem Maßstab für jeden. Aus = die eigenen Treffereffekte des Spiels. Wirkt sofort; eine bereits fliegende Granate behält ihren Effekt. Die Klassen werden im Reiter Geschütze festgelegt.
help.Effects/LifeRaftLights = Ein blinkendes rotes Licht auf Rettungsinseln (nachts sichtbar). Aus = Inseln ohne Licht. Wirkt sofort.
help.Effects/BubblesStopMinutes = Minuten (Spielzeit, Zeitraffer zählt mit) nach Beginn des Untergangs eines Schiffs, nach denen sein Blaseneffekt nicht mehr ausstößt (das Spiel beendet ihn nie, solange das Wrack existiert). Spart Ressourcen in langen Missionen. 0 = nie, wie im Spiel.
help.UI/HideUnobservedTargets3D = Ziele anderer Seiten, die nicht visuell beobachtet werden (nur per Radar, Sonar oder Daten bekannt), werden in der 3D-Ansicht nicht gezeichnet. Eigene Einheiten werden immer gezeichnet. Nicht wirksam, solange die Cheat-Schalter „Show Unidentified“ oder „Control Enemy Units“ des F10-Menüs aktiv sind.
help.UI/HideUnobservedSubmarines3D = Ist das Ausblenden unbeobachteter Ziele aktiv, werden auch U-Boote ausgeblendet. Aus: U-Boote werden immer gezeichnet (sie werden fast nie visuell gesehen). Zählt nur, wenn „Ziele ausblenden, die in 3D nicht gesehen werden“ aktiv ist.
help.Effects/ColourGradingNoDepthMask = Die Farbkorrektur des Spiels hängt von der Tiefe hinter einem Pixel ab; Rauch hat keine eigene Tiefe und wechselte daher am Horizont abrupt die Farbe (braun über dem Meer, grau über dem Himmel). An: überall dieselbe Korrektur. Aus = wie im Spiel.
help.Guns/MachineGunBurstFix = Maschinengewehre zeigen bei jedem Schuss ihr Mündungsfeuer: ein noch laufender gepoolter Effekt wird neu gestartet.
help.Guns/MachineGunSoundLoopFix = Der Schleifen-Feuerton der Maschinengewehre überspringt den stillen Teil seines Clips (eine Lücke mitten in einer langen Salve).
help.Guns/HitSoundFix = Geschütztreffer spielen immer ihren Explosionston: ein Effekt, dessen Ton nicht gestartet ist (gepoolte Instanz), wird zum Abspielen gebracht.
help.General/Debug = Ausführliche Protokollierung und BepInEx/AlternativeWeaponsControl.trace.txt.
help.Debug/CamOffColor = Debug, um herauszufinden, was die Rauchfarbe am Horizont verändert: schaltet diesen Kameraeffekt des Spiels aus, solange es an ist. Wird nicht in den Optionen des Spiels gespeichert.
help.Debug/CamOffUnderwater = Debug, um herauszufinden, was die Rauchfarbe am Horizont verändert: schaltet diesen Kameraeffekt des Spiels aus, solange es an ist. Wird nicht in den Optionen des Spiels gespeichert.
help.Debug/CamOffOcclusion = Debug, um herauszufinden, was die Rauchfarbe am Horizont verändert: schaltet diesen Kameraeffekt des Spiels aus, solange es an ist. Wird nicht in den Optionen des Spiels gespeichert.
help.Debug/CamOffBloom = Debug, um herauszufinden, was die Rauchfarbe am Horizont verändert: schaltet diesen Kameraeffekt des Spiels aus, solange es an ist. Wird nicht in den Optionen des Spiels gespeichert.
help.General/Language = Sprache der Mod-Texte: ein Code einer Spielsprache (en, ru ...); leer = die eigene Sprache des Spiels. Die Texte stehen in den Dateien lang/<Code>.ini im Mod-Ordner - zum Übersetzen bearbeiten.
