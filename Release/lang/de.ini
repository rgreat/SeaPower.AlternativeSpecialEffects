unit.x = x
help.Effects/FireFlicker = Das Licht eines Brandes auf einem Schiff flackert, tiefer und schneller je stärker der Brand (klein / mittel / schwer).
help.Effects/FireLightPower = Helligkeit des Brandlichts auf Schiffen (das eigene Brandlicht des Spiels, multipliziert; seine Reichweite wächst auch). 1 = wie im Spiel.
help.Effects/MuzzleFlashLight = Ein kurzer Lichtblitz an der Mündung, wenn Geschütze, CIWS und Maschinengewehre feuern (nachts sichtbar).
help.Effects/MissileLaunchFlashLight = Ein Licht begleitet eine Rakete, solange ihr Booster nach dem Start brennt (die Boosterbrenndauer der Rakete).
help.Effects/HitFlashLight = Ein kurzer Lichtblitz dort, wo eine Granate einschlägt (nicht im Wasser).
help.Effects/DayBrightness = Helligkeit der Lichtblitze und des Feuerlichts am Tag, 1 = keine Abdunklung. Bei vollem Sonnenschein werden die Lichter mit diesem Wert multipliziert (nachts unverändert): Sonne und helles Licht addieren sich und brennen in Weiß und Rosa aus.
help.Effects/FlashPower = Helligkeit und Größe der Blitze, 1 = Standard.
help.Effects/FlashLimit = Die Geschütze, CIWS und Maschinengewehre des Spielers drehen und heben sich zu einem Ziel jenseits ihrer Maximalreichweite (bis 1,5 x die Reichweite, mindestens 5 sm), ohne zu feuern, als wäre es in Maximalreichweite. Aus = wie im Spiel: der Turm bleibt still, bis das Ziel in Reichweite ist.
help.Effects/ExtraSmokeEmitters = Anzahl der Feuer- und Rauchpunkte nach Schiffslänge statt der drei des Spiels: unter 25 m 1, unter 50 m 2, unter 75 m 3, ab 75 m 5 (einer je Sektion, jeder zeigt das Feuer seiner Sektion). Gilt für Schiffe, die ab jetzt erzeugt werden.
help.Effects/SmokeBySeverity = Das Aussehen des Feuers richtet sich nach seiner Stärke (Anteil des Maximums) statt nach den Stufen des Spiels: klein, mittel ab SmokeModerateFrom, schwer ab SmokeSevereFrom (Spiel: 25 % / 50 %); der Rauch des kleinen Feuers wächst von SmokeStartOpacity bis SmokeEndOpacity. Nur das Aussehen – Schaden und Ausbreitung bleiben wie im Spiel. Aus = wie im Spiel.
help.Effects/SmokeStartOpacity = Kleines Feuer: Rauchdeckkraft neuer Partikel bei 0 % des Maximums des Feuers, % des Spielwerts.
help.Effects/SmokeEndOpacity = Kleines Feuer: Rauchdeckkraft neuer Partikel bei SmokeModerateFrom, % des Spielwerts; dazwischen gleichmäßig nach Stärke des Feuers.
help.Effects/SmokeModerateFrom = Das Aussehen des mittleren Feuers ab dieser Stärke, % des Maximums des Feuers (Spiel: 25 %).
help.Effects/SmokeSevereFrom = Das Aussehen des schweren Feuers ab dieser Stärke, % des Maximums des Feuers (Spiel: 50 %).
help.Effects/SmokeSortFix = Rauchsäulen eines Schiffs überlagern sich in der richtigen Reihenfolge: Jedes Rauchsystem wird nach dem Abstand zu seinem Feuerpunkt sortiert, nicht zur Mitte seiner Begrenzung (die Mitte einer hohen Fahne liegt weit oben). Aus = wie im Spiel.
help.Effects/SmokeDensityFactor = Dichte von Feuer und Rauch der Schiffe: Die Zahl der ausgestoßenen Partikel wird damit multipliziert (1 = wie im Spiel; Standard 2). Sonst ändert sich nichts.
help.Effects/SmokeLifetimeFactor = Der Rauch von Schiffsbränden hält so viel mal länger, bevor er sich lichtet (1 = wie im Spiel).
help.FunnelSmoke/Enabled = Der Schornsteinrauch der Schiffe richtet sich nach Antriebsart und Last: Dichte, Helligkeit und Stärke legen die Gruppen unten fest (Diesel, Steam, GasTurbine, Nuclear, Combined). Die Gruppe eines Schiffs ist sein verwendetes Antriebssystem; funnel_groups.txt (neben der dll) zwingt ein Schiff in eine andere Gruppe. Aus = wie im Spiel.
help.FunnelSmoke/GlobalThickness = Dichte (Deckkraft der Partikel) des Schornsteinrauchs aller Schiffe, × des Spielwerts; die Werte der Gruppen werden damit multipliziert. Kostet keine Leistung.
help.FunnelSmoke/GlobalDensity = Anzahl der Schornsteinrauch-Partikel aller Schiffe, × des Spielwerts; die Werte der Gruppen werden damit multipliziert. Mehr Partikel kosten Leistung: besser GlobalThickness verwenden.
help.FunnelSmoke/DieselDensityIdle = Menge der Schornsteinrauch-Partikel dieser Gruppe bei niedriger Geschwindigkeit, × des Spielwerts.
help.FunnelSmoke/DieselDensityFull = Menge der Schornsteinrauch-Partikel dieser Gruppe bei voller Leistung, × des Spielwerts; dazwischen gleichmäßig nach Geschwindigkeit (ein beschleunigendes Schiff zählt als bei voller Leistung).
help.FunnelSmoke/DieselLightIdle = Helligkeit des Schornsteinrauchs dieser Gruppe bei niedriger Geschwindigkeit, %: 0 = schwarz, 100 = weiß (ein neutrales Grau; der Rauch des Spiels ist dunkel bräunlich).
help.FunnelSmoke/DieselLightFull = Helligkeit des Schornsteinrauchs dieser Gruppe bei voller Geschwindigkeit, %: 0 = schwarz, 100 = weiß.
help.FunnelSmoke/DieselThicknessIdle = Dichte des Schornsteinrauchs dieser Gruppe bei niedriger Geschwindigkeit (wie dicht er wirkt), × des Spielwerts; über 1 wird er dichter.
help.FunnelSmoke/DieselThicknessFull = Dichte des Schornsteinrauchs dieser Gruppe bei voller Geschwindigkeit (wie dicht er wirkt), × des Spielwerts; dazwischen gleichmäßig nach Geschwindigkeit.
help.FunnelSmoke/DieselLifeIdle = Wie lange der Schornsteinrauch dieser Gruppe bei niedriger Geschwindigkeit bleibt, × des Spielwerts (die Lebensdauer seiner Partikel; die Fahne wird dadurch auch länger). Nur neue Partikel ändern sich.
help.FunnelSmoke/DieselLifeFull = Wie lange der Schornsteinrauch dieser Gruppe bei voller Geschwindigkeit bleibt, × des Spielwerts; dazwischen gleichmäßig nach Geschwindigkeit. Nur neue Partikel ändern sich.
help.FunnelSmoke/SteamDensityIdle = Menge der Schornsteinrauch-Partikel dieser Gruppe bei niedriger Geschwindigkeit, × des Spielwerts.
help.FunnelSmoke/SteamDensityFull = Menge der Schornsteinrauch-Partikel dieser Gruppe bei voller Leistung, × des Spielwerts; dazwischen gleichmäßig nach Geschwindigkeit (ein beschleunigendes Schiff zählt als bei voller Leistung).
help.FunnelSmoke/SteamLightIdle = Helligkeit des Schornsteinrauchs dieser Gruppe bei niedriger Geschwindigkeit, %: 0 = schwarz, 100 = weiß (ein neutrales Grau; der Rauch des Spiels ist dunkel bräunlich).
help.FunnelSmoke/SteamLightFull = Helligkeit des Schornsteinrauchs dieser Gruppe bei voller Geschwindigkeit, %: 0 = schwarz, 100 = weiß.
help.FunnelSmoke/SteamThicknessIdle = Dichte des Schornsteinrauchs dieser Gruppe bei niedriger Geschwindigkeit (wie dicht er wirkt), × des Spielwerts; über 1 wird er dichter.
help.FunnelSmoke/SteamThicknessFull = Dichte des Schornsteinrauchs dieser Gruppe bei voller Geschwindigkeit (wie dicht er wirkt), × des Spielwerts; dazwischen gleichmäßig nach Geschwindigkeit.
help.FunnelSmoke/SteamLifeIdle = Wie lange der Schornsteinrauch dieser Gruppe bei niedriger Geschwindigkeit bleibt, × des Spielwerts (die Lebensdauer seiner Partikel; die Fahne wird dadurch auch länger). Nur neue Partikel ändern sich.
help.FunnelSmoke/SteamLifeFull = Wie lange der Schornsteinrauch dieser Gruppe bei voller Geschwindigkeit bleibt, × des Spielwerts; dazwischen gleichmäßig nach Geschwindigkeit. Nur neue Partikel ändern sich.
help.FunnelSmoke/GasTurbineDensityIdle = Menge der Schornsteinrauch-Partikel dieser Gruppe bei niedriger Geschwindigkeit, × des Spielwerts.
help.FunnelSmoke/GasTurbineDensityFull = Menge der Schornsteinrauch-Partikel dieser Gruppe bei voller Leistung, × des Spielwerts; dazwischen gleichmäßig nach Geschwindigkeit (ein beschleunigendes Schiff zählt als bei voller Leistung).
help.FunnelSmoke/GasTurbineLightIdle = Helligkeit des Schornsteinrauchs dieser Gruppe bei niedriger Geschwindigkeit, %: 0 = schwarz, 100 = weiß (ein neutrales Grau; der Rauch des Spiels ist dunkel bräunlich).
