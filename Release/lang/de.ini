help.FunnelSmoke/GasTurbineThicknessFull = Dichte des Schornsteinrauchs dieser Gruppe bei voller Geschwindigkeit (wie dicht er wirkt), × des Spielwerts; dazwischen gleichmäßig nach Geschwindigkeit.
help.FunnelSmoke/GasTurbineLifeIdle = Wie lange der Schornsteinrauch dieser Gruppe bei niedriger Geschwindigkeit bleibt, × des Spielwerts (die Lebensdauer seiner Partikel; die Fahne wird dadurch auch länger). Nur neue Partikel ändern sich.
