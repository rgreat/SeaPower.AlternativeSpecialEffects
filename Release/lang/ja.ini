help.Effects/FireFlicker = 艦上の火災の光がちらつきます。火災が強いほど深く速く（小 / 中 / 大）。
help.Effects/FireLightPower = 艦上の火災の光の明るさ（ゲーム本来の火災の光を倍率調整；範囲も拡大）。1 = ゲームどおり。
help.Effects/MuzzleFlashLight = 砲、CIWS、機関砲の発射時に砲口で短い閃光（夜間に見えます）。
help.Effects/MissileLaunchFlashLight = 発射後、ブースターが燃えている間ミサイルに光が付きます（ミサイルのブースター燃焼時間）。
help.Effects/HitFlashLight = 砲弾が命中した場所での短い閃光（水中は除く）。
help.Effects/DayBrightness = 昼間の閃光と火災の光の明るさ。1 = 減光なし。真昼にはこの値が掛けられます（夜は変化なし）。日光と強い光が重なって白やピンクに飛ぶのを防ぎます。
help.Effects/FlashPower = 閃光の明るさとサイズ、1 = 既定。
help.Effects/FlashLimit = プレイヤーの砲、CIWS、機関砲は、最大射程外の目標（射程の最大1.5倍、最低5海里）に向けて、射撃せずに旋回・仰角を取ります。最大射程にあるかのように。オフ = ゲームどおり：目標が射程に入るまで砲塔は動きません。
help.Effects/ExtraSmokeEmitters = ゲームの 3 か所の代わりに、艦の長さに応じた火と煙の発生点の数: 25 m 未満は 1、50 m 未満は 2、75 m 未満は 3、75 m 以上は 5（区画ごとに 1 つ、それぞれ自分の区画の火を表示）。これ以降に生成される艦艇が対象です。
help.Effects/SmokeBySeverity = 火の見た目を、ゲームの段階ではなく火の強さ（最大値に対する割合）で決めます: 小、SmokeModerateFrom から中、SmokeSevereFrom から大（ゲームでは 25% / 50%）。小さな火の煙は SmokeStartOpacity から SmokeEndOpacity へ増えます。変わるのは見た目だけで、ダメージと延焼はゲームのままです。オフ = ゲームどおり。
help.Effects/SmokeStartOpacity = 小さな火: 火が最大値の 0% のときの新しいパーティクルの煙の不透明度（ゲームの値に対する %）。
help.Effects/SmokeEndOpacity = 小さな火: 火が SmokeModerateFrom のときの新しいパーティクルの煙の不透明度（ゲームの値に対する %）。中間は火の強さに応じて均等に変化します。
help.Effects/SmokeModerateFrom = この強さから中程度の火の見た目になります（火の最大値に対する %。ゲームでは 25%）。
help.Effects/SmokeSevereFrom = この強さから激しい火の見た目になります（火の最大値に対する %。ゲームでは 50%）。
help.Effects/SmokeSortFix = 同じ艦艇の煙柱が正しい順序で重なります。各煙システムは、境界の中心ではなく発火点までの距離で並べ替えられます（高い煙柱の中心は高い位置にあるため）。オフ = ゲームどおり。
help.Effects/SmokeDensityFactor = 艦艇の火と煙の密度: 放出されるパーティクルの数にこの値を掛けます（1 = ゲームどおり。既定値は 2）。他は変わりません。
help.Effects/SmokeLifetimeFactor = 艦艇火災の煙が薄れるまでの時間をこの倍率だけ延ばします（1 = ゲームどおり）。
help.FunnelSmoke/Enabled = 艦艇の煙突の煙はエンジンの種類と負荷に従います。密度・明るさ・濃さは下のグループ（Diesel、Steam、GasTurbine、Nuclear、Combined）で設定します。艦艇のグループは使用中の動力システムで決まり、funnel_groups.txt（dll の隣）で別のグループに強制できます。オフ = ゲームどおり。
help.FunnelSmoke/GlobalThickness = すべての艦艇の煙突の煙の濃さ（パーティクルの不透明度）。ゲームの値に対する倍率で、各グループの値にこれが掛けられます。処理負荷はかかりません。
help.FunnelSmoke/GlobalDensity = すべての艦艇の煙突の煙のパーティクル数。ゲームの値に対する倍率で、各グループの値にこれが掛けられます。パーティクルを増やすと処理が重くなるため、GlobalThickness を優先してください。
help.FunnelSmoke/DieselDensityIdle = このグループの低速時の煙突の煙のパーティクル量。ゲームの値に対する倍率。
help.FunnelSmoke/DieselDensityFull = このグループの全出力時の煙突の煙のパーティクル量。ゲームの値に対する倍率。中間は速度に応じて均等に変化します（加速中の艦艇は全出力として扱います）。
help.FunnelSmoke/DieselLightIdle = このグループの低速時の煙突の煙の明るさ（%）: 0 = 黒、100 = 白（ニュートラルな灰色。ゲームの煙は褐色がかった暗い色です）。
help.FunnelSmoke/DieselLightFull = このグループの全速時の煙突の煙の明るさ（%）: 0 = 黒、100 = 白。
help.FunnelSmoke/DieselThicknessIdle = このグループの低速時の煙突の煙の濃さ（見た目の密度）。ゲームの値に対する倍率。1 より大きいと濃くなります。
help.FunnelSmoke/DieselThicknessFull = このグループの全速時の煙突の煙の濃さ（見た目の密度）。ゲームの値に対する倍率。中間は速度に応じて均等に変化します。
help.FunnelSmoke/DieselLifeIdle = このグループの低速時の煙突の煙が続く時間。ゲームの値に対する倍率（パーティクルの寿命。煙の帯も長くなります）。変わるのは新しいパーティクルだけです。
help.FunnelSmoke/DieselLifeFull = このグループの全速時の煙突の煙が続く時間。ゲームの値に対する倍率。中間は速度に応じて均等に変化します。変わるのは新しいパーティクルだけです。
help.FunnelSmoke/SteamDensityIdle = このグループの低速時の煙突の煙のパーティクル量。ゲームの値に対する倍率。
help.FunnelSmoke/SteamDensityFull = このグループの全出力時の煙突の煙のパーティクル量。ゲームの値に対する倍率。中間は速度に応じて均等に変化します（加速中の艦艇は全出力として扱います）。
help.FunnelSmoke/SteamLightIdle = このグループの低速時の煙突の煙の明るさ（%）: 0 = 黒、100 = 白（ニュートラルな灰色。ゲームの煙は褐色がかった暗い色です）。
help.FunnelSmoke/SteamLightFull = このグループの全速時の煙突の煙の明るさ（%）: 0 = 黒、100 = 白。
help.FunnelSmoke/SteamThicknessIdle = このグループの低速時の煙突の煙の濃さ（見た目の密度）。ゲームの値に対する倍率。1 より大きいと濃くなります。
help.FunnelSmoke/SteamThicknessFull = このグループの全速時の煙突の煙の濃さ（見た目の密度）。ゲームの値に対する倍率。中間は速度に応じて均等に変化します。
help.FunnelSmoke/SteamLifeIdle = このグループの低速時の煙突の煙が続く時間。ゲームの値に対する倍率（パーティクルの寿命。煙の帯も長くなります）。変わるのは新しいパーティクルだけです。
help.FunnelSmoke/SteamLifeFull = このグループの全速時の煙突の煙が続く時間。ゲームの値に対する倍率。中間は速度に応じて均等に変化します。変わるのは新しいパーティクルだけです。
help.FunnelSmoke/GasTurbineDensityIdle = このグループの低速時の煙突の煙のパーティクル量。ゲームの値に対する倍率。
help.FunnelSmoke/GasTurbineDensityFull = このグループの全出力時の煙突の煙のパーティクル量。ゲームの値に対する倍率。中間は速度に応じて均等に変化します（加速中の艦艇は全出力として扱います）。
help.FunnelSmoke/GasTurbineLightIdle = このグループの低速時の煙突の煙の明るさ（%）: 0 = 黒、100 = 白（ニュートラルな灰色。ゲームの煙は褐色がかった暗い色です）。
