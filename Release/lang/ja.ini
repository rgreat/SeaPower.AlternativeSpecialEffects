help.Effects/SmokeFireShare = 艦艇の火のスプライトアニメーション: 最初の部分（長さの %）には炎が含まれ、ゲームの速度のままです。残り（煙）だけが SmokeLifetimeFactor で遅くなります。
help.Effects/SmokeSpreadGrowth = 艦艇火災の煙: パーティクルの寿命のうち遅くなった部分でスプライトが拡大します。値は、ゲームよりスプライトがどれだけ遠くへ飛ぶかの %（0 = ゲームの大きさ、100 = 比例）。
help.Effects/SmokeSpreadFade = 艦艇火災の煙: 拡大するスプライトがより透明になります（%）。100 = 大きくなるほど不透明度が下がる、0 = ゲームの不透明度。
help.Effects/GunHitEffects = 砲弾の命中をより目立つ迫力あるものにします。質量に応じて各砲弾が 10 のクラスのいずれかに分けられ、クラスごとに艦艇・空中・水面・地面への命中エフェクトの組とそれぞれのスケールを持ちます。オフ = ゲーム標準の命中エフェクト。すぐに反映され、すでに空中にある砲弾は元のエフェクトのままです。クラスは「砲」タブで設定します。
help.Effects/LifeRaftLights = 救命いかだに点滅する赤いライト（夜間に見えます）。オフ = ライトなし。すぐに反映されます。
help.Effects/BubblesStopMinutes = 艦艇が沈み始めてから、沈没の泡のエフェクトが放出をやめるまでの分数（ゲーム内時間のため、時間圧縮も反映されます。ゲームでは残骸がある間は止まりません）。長いミッションでリソースを節約できます。0 = なし（ゲームどおり）。
help.UI/HideUnobservedTargets3D = 3D ビューで、目視で観測されていない他陣営の目標（レーダー、ソナー、データのみで把握）を描画しません。自軍の部隊は常に描画されます。F10 メニューのチートスイッチ「Show Unidentified」または「Control Enemy Units」がオンの間は適用されません。
help.UI/HideUnobservedSubmarines3D = 未観測の目標を隠す設定がオンのとき、潜水艦も隠されます。オフ: 潜水艦は常に描画されます（目視されることはほとんどないため）。「3D で見えていない目標を隠す」がオンのときのみ有効です。
help.Effects/ColourGradingNoDepthMask = ゲームのカラーグレーディングはピクセルの奥の深度に依存します。煙には固有の深度がないため、水平線で色が急に変わっていました（海の上は茶色、空の上は灰色）。オン: どこでも同じグレーディング。オフ = ゲームどおり。
help.Guns/MachineGunBurstFix = 機関砲は発射のたびに砲口の閃光を表示：まだ再生中のプール済み閃光エフェクトを再起動します。
help.Guns/MachineGunSoundLoopFix = 機関砲のループ発射音は、クリップの無音部分（長い連射の途中の隙間）をスキップします。
help.Guns/HitSoundFix = 砲の命中は常に爆発音を再生：音が開始しなかったエフェクト（プール済みインスタンス）を強制再生させます。
help.General/Debug = 詳細なログと BepInEx/AlternativeWeaponsControl.trace.txt。
help.Debug/CamOffColor = 水平線で煙の色を変えているものを探すためのデバッグ機能: オンの間、ゲームのこのカメラエフェクトをオフにします。ゲームのオプションには保存されません。
help.Debug/CamOffUnderwater = 水平線で煙の色を変えているものを探すためのデバッグ機能: オンの間、ゲームのこのカメラエフェクトをオフにします。ゲームのオプションには保存されません。
help.Debug/CamOffOcclusion = 水平線で煙の色を変えているものを探すためのデバッグ機能: オンの間、ゲームのこのカメラエフェクトをオフにします。ゲームのオプションには保存されません。
help.Debug/CamOffBloom = 水平線で煙の色を変えているものを探すためのデバッグ機能: オンの間、ゲームのこのカメラエフェクトをオフにします。ゲームのオプションには保存されません。
help.General/Language = Mod のテキストの言語：ゲーム言語のコード（en, ru ...）；空 = ゲーム自身の言語。テキストは Mod フォルダ内の lang/<コード>.ini にあります - 編集して翻訳できます。
