help.Effects/SmokeAfterClouds = Smoke (fires and funnels) and clouds overlap in the right order: before each frame every smoke column is put in front of or behind the clouds by where the cloud layer is on the line from the camera to it (the game sorts a whole cloud cell, kilometres wide, by its centre, so clouds behind a ship could cover its smoke). Off = as in the game.
