help.FunnelSmoke/Nations = 国（艦艇の ini の Nation=）: その国のすべての艦艇の煙突の煙について、グループの値に掛ける倍率（パーティクル量、持続時間（寿命）、明るさ、濃さ）。1 = グループの値。艦艇個別の値（「艦艇」ページ）はさらに掛け合わされます。
