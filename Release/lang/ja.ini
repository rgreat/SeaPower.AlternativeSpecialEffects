help.Effects/SmokeAfterClouds = 煙（火災と煙突）と雲が正しい順序で重なります。毎フレーム前に、カメラからその煙柱へ引いた線上に雲の層がある位置に応じて、各煙柱を雲の手前または奥に置きます（ゲームは幅数 km の雲セル全体を中心で並べ替えるため、艦艇の背後の雲がその煙を覆うことがありました）。オフ = ゲームどおり。
lbl.Effects/SmokeKeepOnStop = 火の段階が変わっても残っている煙を保持
help.Effects/SmokeKeepOnStop = 火の段階が変わったり消えたりしても、すでに空中にある煙は残って消えていきます。止まるのは新しいパーティクルだけです。オフ = ゲームは煙を即座に消します。
