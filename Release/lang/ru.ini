help.Effects/FireFlicker = Свет пожара на корабле мерцает, тем глубже и быстрее, чем сильнее пожар (малый / средний / сильный).
help.Effects/FireLightPower = Яркость света пожаров на кораблях (собственный свет пожара игры, умноженный; дальность тоже растёт). 1 = как в игре.
help.Effects/MuzzleFlashLight = Короткая вспышка света у дула при стрельбе орудий, CIWS и пулемётов (видна ночью).
help.Effects/MissileLaunchFlashLight = Свет сопровождает ракету, пока горит её стартовый ускоритель после пуска (время работы ускорителя ракеты).
help.Effects/HitFlashLight = Короткая вспышка света в месте попадания снаряда (не в воду).
help.Effects/DayBrightness = Яркость вспышек и света пожара днём, 1 = без приглушения. При полном солнце свет умножается на это значение (ночью не меняется): солнце и яркий свет складываются и выгорают в белый и розовый.
help.Effects/FlashPower = Яркость и размер вспышек, 1 = по умолчанию.
help.Effects/FlashLimit = Все одновременные вспышки делят общий предел яркости, поэтому много попаданий сразу не пересвечивают картинку.
help.Effects/ExtraSmokeEmitters = Number of fire and smoke points by ship length instead of the game's three: under 25 m 1, under 50 m 2, under 75 m 3, from 75 m 5 (one per section, each showing its own section's fire). Ships spawned from now on.
help.Effects/SmokeBySeverity = Fire looks by the fire's strength (share of its maximum) instead of the game's stages: small, moderate from SmokeModerateFrom, severe from SmokeSevereFrom (the game: 25% / 50%); the small fire's smoke grows from SmokeStartOpacity to SmokeEndOpacity. Only the look - damage and spreading stay the game's. Off = as in the game.
help.Effects/SmokeStartOpacity = Small fire: smoke opacity of new particles at 0% of the fire's maximum, % of the game's.
help.Effects/SmokeEndOpacity = Small fire: smoke opacity of new particles at SmokeModerateFrom, % of the game's; between - evenly by the fire's strength.
help.Effects/SmokeModerateFrom = The moderate fire's look from this strength, % of the fire's maximum (the game: 25%).
help.Effects/SmokeSevereFrom = The severe fire's look from this strength, % of the fire's maximum (the game: 50%).
help.Effects/SmokeSortFix = Columns of smoke of one ship overlap in the right order: each smoke system is sorted by the distance to its fire point, not to its bounds' centre (a tall plume's centre is high up). Off = as in the game.
help.Effects/SmokeDensityFactor = Density of the ship fire and smoke: the number of particles they emit is multiplied by this (1 = as in the game; default 2). Nothing else changes.
help.Effects/SmokeLifetimeFactor = Ship fire smoke lasts this many times longer before it thins out (1 = as in the game).
help.Effects/SmokeFireShare = Ship fire sprite animation: the first part, % of its length, has the flames in it and keeps the game's speed; only the rest (smoke) is slowed by SmokeLifetimeFactor.
help.Effects/GunHitEffects = Более заметные и зрелищные попадания артиллерийских снарядов (калибры от 37 мм): заменяются эффекты попадания 47 файлов боеприпасов (hit_effects.txt мода, из rgreat cumulative pack). Выкл = штатные эффекты игры. Действует сразу; снаряд, уже находящийся в воздухе, сохраняет прежний эффект.
help.Effects/LifeRaftLights = Мигающий красный огонь на спасательных плотах (виден ночью). Выкл = плоты без огней. Действует сразу.
help.Effects/BubblesStopMinutes = Minutes (game time, so time compression counts) after a ship starts to sink, when its sinking-bubbles effect stops emitting (the game never stops it while the wreck exists). Saves resources in long missions. 0 = never, as in the game.
help.UI/HideUnobservedTargets3D = Do not draw in the 3D view the targets of other sides that are not observed visually (known by radar, sonar or data only). Your own units are always drawn.
help.UI/HideUnobservedSubmarines3D = With hiding of unobserved targets on, submarines are hidden too. Off: submarines are always drawn (they are almost never seen visually). Only counts when 'Hide targets that are not seen in 3D' is on.
help.Optics/BinocularsNormalView = Бинокль на максимальном увеличении стартует с обычным видом (игра включает ночной / тепловой фильтр). Клавиша фильтра игры включает фильтр.
help.Optics/NormalViewDayOnly = Обычный вид по умолчанию только днём; ночью остаётся собственный фильтр игры.
help.Guns/MachineGunBurstFix = Пулемёты показывают вспышку выстрела на каждом выстреле: ещё играющий эффект вспышки из пула перезапускается.
help.Guns/MachineGunSoundLoopFix = Зацикленный звук стрельбы пулемётов пропускает тихую часть записи (провал посреди длинной очереди).
help.Guns/HitSoundFix = Попадания снарядов всегда проигрывают звук взрыва: эффекту, у которого звук не запустился (экземпляр из пула), звук запускается принудительно.
help.General/Debug = Подробный лог и BepInEx/AlternativeWeaponsControl.trace.txt.
help.General/Language = Язык текстов мода: код языка игры (en, ru ...); пусто = язык самой игры. Тексты лежат в файлах lang/<код>.ini в папке мода - правьте их для перевода.
