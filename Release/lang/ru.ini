lbl.Effects/SmokeAfterClouds = Дым и облака в правильном порядке
help.Effects/SmokeAfterClouds = Дым (пожаров и труб) и облака перекрываются в правильном порядке: перед каждым кадром каждый столб дыма ставится перед облаками или за ними в зависимости от того, где на линии от камеры к нему находится слой облаков (игра сортирует целую ячейку облаков шириной в километры по её центру, поэтому облака за кораблём могли закрывать его дым). Выкл. = как в игре.
lbl.Effects/SmokeKeepOnStop = Сохранять живой дым при смене стадии пожара
help.Effects/SmokeKeepOnStop = Когда пожар меняет стадию или гаснет, уже висящий в воздухе дым остаётся и рассеивается; останавливаются только новые частицы. Выкл. = игра стирает его сразу.
