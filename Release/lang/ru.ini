help.FunnelSmoke/Nations = Страны (Nation= в ini корабля): множители к значениям группы для дыма из трубы всех кораблей страны: количество частиц, длительность (время жизни), яркость и густота; 1 = значение группы. Собственные значения корабля (страница «Корабли») умножаются дополнительно.
