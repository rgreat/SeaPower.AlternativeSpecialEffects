help.FunnelSmoke/SizeByPower = Размер частиц дыма по мощности двигателей: × (л. с. / PowerReference) ^ это значение. Большой корабль получает более крупные частицы в начале, малый — более мелкие в конце их жизни. 0 = размер как в игре.
lbl.FunnelSmoke/PowerReference = Опорная мощность
unit.FunnelSmoke/PowerReference = hp
help.FunnelSmoke/PowerExponent = Количество дыма по мощности двигателей: × (л. с. / PowerReference) ^ это значение, ограничено 1..2: малый корабль сохраняет количество как в игре, большой получает до двух раз больше. 0 = количество как в игре для каждого корабля.
help.FunnelSmoke/PowerReference = Мощность в л. с., при которой количество дыма равно значению группы (PowerExponent его не меняет).
