unit.x = x
help.Effects/FireFlicker = Свет пожара на корабле мерцает, тем глубже и быстрее, чем сильнее пожар (малый / средний / сильный).
help.Effects/FireLightPower = Яркость света пожаров на кораблях (собственный свет пожара игры, умноженный; дальность тоже растёт). 1 = как в игре.
help.Effects/MuzzleFlashLight = Короткая вспышка света у дула при стрельбе орудий, CIWS и пулемётов (видна ночью).
help.Effects/MissileLaunchFlashLight = Свет сопровождает ракету, пока горит её стартовый ускоритель после пуска (время работы ускорителя ракеты).
help.Effects/HitFlashLight = Короткая вспышка света в месте попадания снаряда (не в воду).
help.Effects/DayBrightness = Яркость вспышек и света пожара днём, 1 = без приглушения. При полном солнце свет умножается на это значение (ночью не меняется): солнце и яркий свет складываются и выгорают в белый и розовый.
help.Effects/FlashPower = Яркость и размер вспышек, 1 = по умолчанию.
help.Effects/FlashLimit = Все одновременные вспышки делят общий предел яркости, поэтому много попаданий сразу не пересвечивают картинку.
help.Effects/ExtraSmokeEmitters = Количество точек огня и дыма по длине корабля вместо трёх, как в игре: до 25 м — 1, до 50 м — 2, до 75 м — 3, от 75 м — 5 (по одной на отсек, каждая показывает пожар своего отсека). Для кораблей, появившихся с этого момента.
help.Effects/SmokeBySeverity = Вид пожара определяется его силой (доля от максимума), а не стадиями игры: малый, умеренный от SmokeModerateFrom, сильный от SmokeSevereFrom (в игре: 25% / 50%); дым малого пожара растёт от SmokeStartOpacity до SmokeEndOpacity. Меняется только вид — урон и распространение остаются игровыми. Выкл. = как в игре.
help.Effects/SmokeStartOpacity = Малый пожар: непрозрачность дыма новых частиц при 0% от максимума пожара, % от значения игры.
help.Effects/SmokeEndOpacity = Малый пожар: непрозрачность дыма новых частиц при SmokeModerateFrom, % от значения игры; между ними — равномерно по силе пожара.
help.Effects/SmokeModerateFrom = Вид умеренного пожара начиная с этой силы, % от максимума пожара (в игре: 25%).
help.Effects/SmokeSevereFrom = Вид сильного пожара начиная с этой силы, % от максимума пожара (в игре: 50%).
help.Effects/SmokeSortFix = Столбы дыма одного корабля перекрываются в правильном порядке: каждая система дыма сортируется по расстоянию до своей точки пожара, а не до центра её границ (центр высокого шлейфа находится высоко). Выкл. = как в игре.
help.Effects/SmokeDensityFactor = Плотность пожара и дыма кораблей: число испускаемых частиц умножается на это значение (1 = как в игре; по умолчанию 2). Больше ничего не меняется.
help.Effects/SmokeLifetimeFactor = Дым корабельных пожаров держится во столько раз дольше, прежде чем рассеяться (1 = как в игре).
help.FunnelSmoke/Enabled = Дым из труб кораблей зависит от типа двигателя и нагрузки: его плотность, яркость и густота задаются группами ниже (Diesel, Steam, GasTurbine, Nuclear, Combined). Группа корабля — это используемая им силовая установка; funnel_groups.txt (рядом с dll) принудительно переводит корабль в другую группу. Выкл. = как в игре.
help.FunnelSmoke/GlobalThickness = Густота (непрозрачность частиц) дыма из труб всех кораблей, × от значения игры; собственные значения групп умножаются на это. Не снижает скорость.
help.FunnelSmoke/GlobalDensity = Количество частиц дыма из труб всех кораблей, × от значения игры; собственные значения групп умножаются на это. Больше частиц — ниже скорость: лучше использовать GlobalThickness.
help.FunnelSmoke/DieselDensityIdle = Количество частиц дыма из трубы этой группы на малом ходу, × от значения игры.
help.FunnelSmoke/DieselDensityFull = Количество частиц дыма из трубы этой группы на полной мощности, × от значения игры; между ними — равномерно по скорости (разгоняющийся корабль считается идущим на полной мощности).
help.FunnelSmoke/DieselLightIdle = Яркость дыма из трубы этой группы на малом ходу, %: 0 = чёрный, 100 = белый (нейтральный серый; дым в игре тёмный коричневатый).
help.FunnelSmoke/DieselLightFull = Яркость дыма из трубы этой группы на полном ходу, %: 0 = чёрный, 100 = белый.
help.FunnelSmoke/DieselThicknessIdle = Густота дыма из трубы этой группы на малом ходу (насколько он плотный на вид), × от значения игры; больше 1 — плотнее.
help.FunnelSmoke/DieselThicknessFull = Густота дыма из трубы этой группы на полном ходу (насколько он плотный на вид), × от значения игры; между ними — равномерно по скорости.
help.FunnelSmoke/DieselLifeIdle = Как долго держится дым из трубы этой группы на малом ходу, × от значения игры (время жизни его частиц; шлейф тоже становится длиннее). Меняются только новые частицы.
help.FunnelSmoke/DieselLifeFull = Как долго держится дым из трубы этой группы на полном ходу, × от значения игры; между ними — равномерно по скорости. Меняются только новые частицы.
help.FunnelSmoke/SteamDensityIdle = Количество частиц дыма из трубы этой группы на малом ходу, × от значения игры.
help.FunnelSmoke/SteamDensityFull = Количество частиц дыма из трубы этой группы на полной мощности, × от значения игры; между ними — равномерно по скорости (разгоняющийся корабль считается идущим на полной мощности).
help.FunnelSmoke/SteamLightIdle = Яркость дыма из трубы этой группы на малом ходу, %: 0 = чёрный, 100 = белый (нейтральный серый; дым в игре тёмный коричневатый).
help.FunnelSmoke/SteamLightFull = Яркость дыма из трубы этой группы на полном ходу, %: 0 = чёрный, 100 = белый.
help.FunnelSmoke/SteamThicknessIdle = Густота дыма из трубы этой группы на малом ходу (насколько он плотный на вид), × от значения игры; больше 1 — плотнее.
