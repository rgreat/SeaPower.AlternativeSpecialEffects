help.Effects/SmokeFireShare = Анимация спрайта пожара корабля: первая часть (% её длины) содержит пламя и сохраняет скорость игры; только остальная часть (дым) замедляется множителем SmokeLifetimeFactor.
help.Effects/SmokeSpreadGrowth = Дым корабельных пожаров: на замедленной части жизни частицы её спрайт растёт, в % от того, насколько дальше спрайты разлетаются, чем в игре (0 = размер как в игре; 100 = пропорционально).
help.Effects/SmokeSpreadFade = Дым корабельных пожаров: растущие спрайты становятся прозрачнее, % (100 = непрозрачность падает с ростом размера; 0 = непрозрачность как в игре).
help.Effects/GunHitEffects = Более заметные и зрелищные попадания артиллерийских снарядов: по массе каждый снаряд относится к одному из 10 классов, у каждого свой набор эффектов попадания в корабль, разрыва в воздухе, всплеска на воде и попадания в землю и свой размер каждого. Выкл = штатные эффекты игры. Действует сразу; снаряд, уже находящийся в воздухе, сохраняет прежний эффект. Классы настраиваются на вкладке «Орудия».
help.Effects/LifeRaftLights = Мигающий красный огонь на спасательных плотах (виден ночью). Выкл = плоты без огней. Действует сразу.
help.Effects/BubblesStopMinutes = Через сколько минут (игровое время, поэтому сжатие времени учитывается) после начала затопления корабля эффект пузырей перестаёт испускаться (игра никогда его не останавливает, пока существует обломок). Экономит ресурсы в долгих миссиях. 0 = никогда, как в игре.
help.UI/HideUnobservedTargets3D = Не рисовать в 3D-виде цели других сторон, не наблюдаемые визуально (известные только по радару, гидролокатору или данным). Свои юниты рисуются всегда. Не действует, пока включены читы меню F10 «Show Unidentified» или «Control Enemy Units».
help.UI/HideUnobservedSubmarines3D = При включённом скрытии ненаблюдаемых целей подводные лодки тоже скрываются. Выкл.: подводные лодки рисуются всегда (визуально их почти не видно). Учитывается, только когда включено «Скрывать цели, не видимые в 3D».
help.Effects/ColourGradingNoDepthMask = Цветокоррекция игры зависит от глубины за пикселем; у дыма нет собственной глубины, поэтому на горизонте он резко менял цвет (коричневый над морем, серый над небом). Вкл.: везде одинаковая коррекция. Выкл. = как в игре.
help.Guns/MachineGunBurstFix = Пулемёты показывают вспышку выстрела на каждом выстреле: ещё играющий эффект вспышки из пула перезапускается.
help.Guns/MachineGunSoundLoopFix = Зацикленный звук стрельбы пулемётов пропускает тихую часть записи (провал посреди длинной очереди).
help.Guns/HitSoundFix = Попадания снарядов всегда проигрывают звук взрыва: эффекту, у которого звук не запустился (экземпляр из пула), звук запускается принудительно.
help.General/Debug = Подробный лог и BepInEx/AlternativeWeaponsControl.trace.txt.
help.Debug/CamOffColor = Отладка для поиска того, что меняет цвет дыма на горизонте: пока включено, отключает этот эффект камеры игры. В настройках игры не сохраняется.
help.Debug/CamOffUnderwater = Отладка для поиска того, что меняет цвет дыма на горизонте: пока включено, отключает этот эффект камеры игры. В настройках игры не сохраняется.
help.Debug/CamOffOcclusion = Отладка для поиска того, что меняет цвет дыма на горизонте: пока включено, отключает этот эффект камеры игры. В настройках игры не сохраняется.
help.Debug/CamOffBloom = Отладка для поиска того, что меняет цвет дыма на горизонте: пока включено, отключает этот эффект камеры игры. В настройках игры не сохраняется.
help.General/Language = Язык текстов мода: код языка игры (en, ru ...); пусто = язык самой игры. Тексты лежат в файлах lang/<код>.ini в папке мода - правьте их для перевода.
