help.FunnelSmoke/Ships = Отдельные корабли: множители к значениям группы для дыма из трубы этого корабля: количество частиц, длительность (время жизни), яркость и густота; 1 = значение группы. Добавьте корабль из списка или по имени его ini-файла.
