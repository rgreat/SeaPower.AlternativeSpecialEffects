help.Effects/SmokeAfterClouds = 烟雾（火灾和烟囱）与云层按正确顺序叠加：每帧之前，根据云层在摄像机到烟柱连线上的位置，把每根烟柱放到云层之前或之后（游戏按中心点对整块数公里宽的云单元排序，因此舰船后方的云可能遮住它的烟）。关闭 = 与游戏一致。
