help.Effects/FireFlicker = 舰上火灾的光会闪烁，火势越强闪烁越深越快（小 / 中 / 大）。
help.Effects/FireLightPower = 舰上火灾光的亮度（游戏自身的火灾光乘以倍数；范围也随之增大）。1 = 游戏默认。
help.Effects/MuzzleFlashLight = 火炮、近防炮和机枪开火时炮口的短暂闪光（夜间可见）。
help.Effects/MissileLaunchFlashLight = 导弹发射后助推器燃烧期间有光跟随（导弹助推器的燃烧时间）。
help.Effects/HitFlashLight = 炮弹命中处的短暂闪光（水中除外）。
help.Effects/DayBrightness = 白天闪光和火光的亮度，1 = 不减弱。烈日下光线乘以该值（夜间不变）：阳光与强光叠加会过曝成白色和粉色。
help.Effects/FlashPower = 闪光的亮度和大小，1 = 默认。
help.Effects/FlashLimit = 玩家的火炮、近防炮和机枪会转向并抬高指向超出最大射程的目标（最多射程的 1.5 倍，至少 5 海里）而不开火，如同目标在最大射程处。关 = 如游戏：目标进入射程前炮塔保持不动。
help.Effects/ExtraSmokeEmitters = Number of fire and smoke points by ship length instead of the game's three: under 25 m 1, under 50 m 2, under 75 m 3, from 75 m 5 (one per section, each showing its own section's fire). Ships spawned from now on.
help.Effects/SmokeBySeverity = Fire looks by the fire's strength (share of its maximum) instead of the game's stages: small, moderate from SmokeModerateFrom, severe from SmokeSevereFrom (the game: 25% / 50%); the small fire's smoke grows from SmokeStartOpacity to SmokeEndOpacity. Only the look - damage and spreading stay the game's. Off = as in the game.
help.Effects/SmokeStartOpacity = Small fire: smoke opacity of new particles at 0% of the fire's maximum, % of the game's.
help.Effects/SmokeEndOpacity = Small fire: smoke opacity of new particles at SmokeModerateFrom, % of the game's; between - evenly by the fire's strength.
help.Effects/SmokeModerateFrom = The moderate fire's look from this strength, % of the fire's maximum (the game: 25%).
help.Effects/SmokeSevereFrom = The severe fire's look from this strength, % of the fire's maximum (the game: 50%).
help.Effects/SmokeSortFix = Columns of smoke of one ship overlap in the right order: each smoke system is sorted by the distance to its fire point, not to its bounds' centre (a tall plume's centre is high up). Off = as in the game.
help.Effects/SmokeDensityFactor = Density of the ship fire and smoke: the number of particles they emit is multiplied by this (1 = as in the game; default 2). Nothing else changes.
help.Effects/SmokeLifetimeFactor = Ship fire smoke lasts this many times longer before it thins out (1 = as in the game).
help.FunnelSmoke/Enabled = Funnel smoke of ships follows the engine type and the load: its density, lightness and thickness are set by the group below (Diesel, Steam, GasTurbine, Nuclear, Combined). A ship's group is its power system in use; funnel_groups.txt (next to the dll) forces a ship into another group. Off = as in the game.
help.FunnelSmoke/GlobalThickness = Thickness (opacity of the particles) of the funnel smoke of all ships, x of the game's; the groups' own values are multiplied by this. Costs no speed.
help.FunnelSmoke/GlobalDensity = Number of funnel smoke particles of all ships, x of the game's; the groups' own values are multiplied by this. More particles cost speed: prefer GlobalThickness.
help.FunnelSmoke/DieselDensityIdle = Amount of funnel smoke particles of this group at low speed, x of the game's.
help.FunnelSmoke/DieselDensityFull = Amount of funnel smoke particles of this group at full power, x of the game's; between - evenly by the speed (a ship that is speeding up counts as at full power).
help.FunnelSmoke/DieselLightIdle = Lightness of the funnel smoke of this group at low speed, %: 0 = black, 100 = white (a neutral grey; the game's smoke is a dark brownish one).
help.FunnelSmoke/DieselLightFull = Lightness of the funnel smoke of this group at full speed, %: 0 = black, 100 = white.
help.FunnelSmoke/DieselThicknessIdle = Thickness of the funnel smoke of this group at low speed (how dense it looks), x of the game's; over 1 makes it denser.
help.FunnelSmoke/DieselThicknessFull = Thickness of the funnel smoke of this group at full speed (how dense it looks), x of the game's; between - evenly by the speed.
help.FunnelSmoke/DieselLifeIdle = How long the funnel smoke of this group lasts at low speed, x of the game's (the lifetime of its particles; it also makes the plume longer). Only new particles change.
help.FunnelSmoke/DieselLifeFull = How long the funnel smoke of this group lasts at full speed, x of the game's; between - evenly by the speed. Only new particles change.
help.FunnelSmoke/SteamDensityIdle = Amount of funnel smoke particles of this group at low speed, x of the game's.
help.FunnelSmoke/SteamDensityFull = Amount of funnel smoke particles of this group at full power, x of the game's; between - evenly by the speed (a ship that is speeding up counts as at full power).
help.FunnelSmoke/SteamLightIdle = Lightness of the funnel smoke of this group at low speed, %: 0 = black, 100 = white (a neutral grey; the game's smoke is a dark brownish one).
help.FunnelSmoke/SteamLightFull = Lightness of the funnel smoke of this group at full speed, %: 0 = black, 100 = white.
help.FunnelSmoke/SteamThicknessIdle = Thickness of the funnel smoke of this group at low speed (how dense it looks), x of the game's; over 1 makes it denser.
help.FunnelSmoke/SteamThicknessFull = Thickness of the funnel smoke of this group at full speed (how dense it looks), x of the game's; between - evenly by the speed.
help.FunnelSmoke/SteamLifeIdle = How long the funnel smoke of this group lasts at low speed, x of the game's (the lifetime of its particles; it also makes the plume longer). Only new particles change.
help.FunnelSmoke/SteamLifeFull = How long the funnel smoke of this group lasts at full speed, x of the game's; between - evenly by the speed. Only new particles change.
help.FunnelSmoke/GasTurbineDensityIdle = Amount of funnel smoke particles of this group at low speed, x of the game's.
help.FunnelSmoke/GasTurbineDensityFull = Amount of funnel smoke particles of this group at full power, x of the game's; between - evenly by the speed (a ship that is speeding up counts as at full power).
help.FunnelSmoke/GasTurbineLightIdle = Lightness of the funnel smoke of this group at low speed, %: 0 = black, 100 = white (a neutral grey; the game's smoke is a dark brownish one).
help.FunnelSmoke/GasTurbineLightFull = Lightness of the funnel smoke of this group at full speed, %: 0 = black, 100 = white.
help.FunnelSmoke/GasTurbineThicknessIdle = Thickness of the funnel smoke of this group at low speed (how dense it looks), x of the game's; over 1 makes it denser.
help.FunnelSmoke/GasTurbineThicknessFull = Thickness of the funnel smoke of this group at full speed (how dense it looks), x of the game's; between - evenly by the speed.
help.FunnelSmoke/GasTurbineLifeIdle = How long the funnel smoke of this group lasts at low speed, x of the game's (the lifetime of its particles; it also makes the plume longer). Only new particles change.
help.FunnelSmoke/GasTurbineLifeFull = How long the funnel smoke of this group lasts at full speed, x of the game's; between - evenly by the speed. Only new particles change.
help.FunnelSmoke/NuclearDensityIdle = Amount of funnel smoke particles of this group at low speed, x of the game's.
help.FunnelSmoke/NuclearDensityFull = Amount of funnel smoke particles of this group at full power, x of the game's; between - evenly by the speed (a ship that is speeding up counts as at full power).
help.FunnelSmoke/NuclearLightIdle = Lightness of the funnel smoke of this group at low speed, %: 0 = black, 100 = white (a neutral grey; the game's smoke is a dark brownish one).
help.FunnelSmoke/NuclearLightFull = Lightness of the funnel smoke of this group at full speed, %: 0 = black, 100 = white.
help.FunnelSmoke/NuclearThicknessIdle = Thickness of the funnel smoke of this group at low speed (how dense it looks), x of the game's; over 1 makes it denser.
help.FunnelSmoke/NuclearThicknessFull = Thickness of the funnel smoke of this group at full speed (how dense it looks), x of the game's; between - evenly by the speed.
help.FunnelSmoke/NuclearLifeIdle = How long the funnel smoke of this group lasts at low speed, x of the game's (the lifetime of its particles; it also makes the plume longer). Only new particles change.
help.FunnelSmoke/NuclearLifeFull = How long the funnel smoke of this group lasts at full speed, x of the game's; between - evenly by the speed. Only new particles change.
help.FunnelSmoke/CombinedDensityIdle = Amount of funnel smoke particles of this group at low speed, x of the game's.
help.FunnelSmoke/CombinedDensityFull = Amount of funnel smoke particles of this group at full power, x of the game's; between - evenly by the speed (a ship that is speeding up counts as at full power).
help.FunnelSmoke/CombinedLightIdle = Lightness of the funnel smoke of this group at low speed, %: 0 = black, 100 = white (a neutral grey; the game's smoke is a dark brownish one).
help.FunnelSmoke/CombinedLightFull = Lightness of the funnel smoke of this group at full speed, %: 0 = black, 100 = white.
help.FunnelSmoke/CombinedThicknessIdle = Thickness of the funnel smoke of this group at low speed (how dense it looks), x of the game's; over 1 makes it denser.
help.FunnelSmoke/CombinedThicknessFull = Thickness of the funnel smoke of this group at full speed (how dense it looks), x of the game's; between - evenly by the speed.
help.FunnelSmoke/CombinedLifeIdle = How long the funnel smoke of this group lasts at low speed, x of the game's (the lifetime of its particles; it also makes the plume longer). Only new particles change.
help.FunnelSmoke/CombinedLifeFull = How long the funnel smoke of this group lasts at full speed, x of the game's; between - evenly by the speed. Only new particles change.
help.Effects/SmokeFireShare = Ship fire sprite animation: the first part, % of its length, has the flames in it and keeps the game's speed; only the rest (smoke) is slowed by SmokeLifetimeFactor.
help.Effects/SmokeSpreadGrowth = Ship fire smoke: on the slowed part of a particle's life its sprite grows, % of how much farther apart the sprites fly than in the game (0 = the game's size; 100 = in proportion).
help.Effects/SmokeSpreadFade = Ship fire smoke: the growing sprites get more transparent, % (100 = the opacity falls as the size grows; 0 = the game's opacity).
help.Effects/GunHitEffects = More visible and spectacular hits of gun shells: by its mass every gun shell gets one of 10 classes, each with its own collection of the hit effects on a ship, in the air, on the water and on the ground, and a scale of each. Off = the game's own hit effects. Takes effect at once; a shell already in the air keeps the effect it had. The classes are set in the Guns tab.
help.Effects/LifeRaftLights = A blinking red light on life rafts (visible at night). Off = rafts without lights. Takes effect at once.
help.Effects/BubblesStopMinutes = Minutes (game time, so time compression counts) after a ship starts to sink, when its sinking-bubbles effect stops emitting (the game never stops it while the wreck exists). Saves resources in long missions. 0 = never, as in the game.
help.UI/HideUnobservedTargets3D = Do not draw in the 3D view the targets of other sides that are not observed visually (known by radar, sonar or data only). Your own units are always drawn. Not applied while the F10 menu's cheat switches "Show Unidentified" or "Control Enemy Units" are on.
help.UI/HideUnobservedSubmarines3D = With hiding of unobserved targets on, submarines are hidden too. Off: submarines are always drawn (they are almost never seen visually). Only counts when 'Hide targets that are not seen in 3D' is on.
help.Effects/ColourGradingNoDepthMask = The game's colour grading depends on the depth behind a pixel; smoke has no depth of its own, so it changed its colour sharply at the horizon (brown over the sea, grey over the sky). On: the same grading everywhere. Off = as in the game.
help.Guns/MachineGunBurstFix = 机枪每次射击都显示炮口火焰：仍在播放的池化火焰特效会重新开始。
help.Guns/MachineGunSoundLoopFix = 机枪的循环射击声跳过片段的静音部分（长连发中间的空隙）。
help.Guns/HitSoundFix = 火炮命中始终播放爆炸声：声音未启动的特效（池化实例）被强制播放。
help.General/Debug = 详细日志和 BepInEx/AlternativeWeaponsControl.trace.txt。
help.Debug/CamOffColor = Debug, for finding what changes the smoke colour at the horizon: switches this camera effect of the game off while it is on. Not saved into the game's options.
help.Debug/CamOffUnderwater = Debug, for finding what changes the smoke colour at the horizon: switches this camera effect of the game off while it is on. Not saved into the game's options.
help.Debug/CamOffOcclusion = Debug, for finding what changes the smoke colour at the horizon: switches this camera effect of the game off while it is on. Not saved into the game's options.
help.Debug/CamOffBloom = Debug, for finding what changes the smoke colour at the horizon: switches this camera effect of the game off while it is on. Not saved into the game's options.
