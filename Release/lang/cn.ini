help.Effects/FireFlicker = 舰上火灾的光会闪烁，火势越强闪烁越深越快（小 / 中 / 大）。
help.Effects/FireLightPower = 舰上火灾光的亮度（游戏自身的火灾光乘以倍数；范围也随之增大）。1 = 游戏默认。
help.Effects/MuzzleFlashLight = 火炮、近防炮和机枪开火时炮口的短暂闪光（夜间可见）。
help.Effects/MissileLaunchFlashLight = 导弹发射后助推器燃烧期间有光跟随（导弹助推器的燃烧时间）。
help.Effects/HitFlashLight = 炮弹命中处的短暂闪光（水中除外）。
help.Effects/DayBrightness = 白天闪光和火光的亮度，1 = 不减弱。烈日下光线乘以该值（夜间不变）：阳光与强光叠加会过曝成白色和粉色。
help.Effects/FlashPower = 闪光的亮度和大小，1 = 默认。
help.Effects/FlashLimit = 玩家的火炮、近防炮和机枪会转向并抬高指向超出最大射程的目标（最多射程的 1.5 倍，至少 5 海里）而不开火，如同目标在最大射程处。关 = 如游戏：目标进入射程前炮塔保持不动。
help.Effects/ExtraSmokeEmitters = 按舰船长度设置火与烟的发射点数量，取代游戏原有的三个：25 米以下 1 个，50 米以下 2 个，75 米以下 3 个，75 米及以上 5 个（每个分区一个，各自显示本分区的火）。仅对此后生成的舰船生效。
help.Effects/SmokeBySeverity = 按火势强度（占其最大值的比例）而不是游戏的阶段来决定火焰外观：小火、从 SmokeModerateFrom 起为中等、从 SmokeSevereFrom 起为严重（游戏：25% / 50%）；小火的烟雾从 SmokeStartOpacity 逐渐增加到 SmokeEndOpacity。只改变外观——伤害和蔓延仍由游戏决定。关闭 = 与游戏一致。
help.Effects/SmokeStartOpacity = 小火：火势为最大值 0% 时新粒子的烟雾不透明度，游戏值的 %。
help.Effects/SmokeEndOpacity = 小火：火势达到 SmokeModerateFrom 时新粒子的烟雾不透明度，游戏值的 %；两者之间按火势强度均匀过渡。
help.Effects/SmokeModerateFrom = 从此强度起采用中等火势外观，占火势最大值的 %（游戏：25%）。
help.Effects/SmokeSevereFrom = 从此强度起采用严重火势外观，占火势最大值的%（游戏：50%）。
help.Effects/SmokeSortFix = 同一艘舰船的烟柱按正确顺序叠加：每个烟雾系统按到其火点的距离排序，而不是按到其包围盒中心的距离（高大烟柱的中心在高处）。关闭 = 与游戏一致。
help.Effects/SmokeDensityFactor = 舰船火与烟的密度：它们发射的粒子数量乘以此值（1 = 与游戏一致；默认 2）。其他一切不变。
help.Effects/SmokeLifetimeFactor = 舰船火灾烟雾在变淡前持续的时间延长为此倍数（1 = 与游戏一致）。
help.FunnelSmoke/Enabled = 舰船的烟囱烟雾随发动机类型和负荷变化：其密度、明度和浓度由下方各组设置（Diesel、Steam、GasTurbine、Nuclear、Combined）。舰船所属组即其正在使用的动力系统；funnel_groups.txt（位于 dll 旁）可强制将舰船归入其他组。关闭 = 与游戏一致。
help.FunnelSmoke/GlobalThickness = 所有舰船烟囱烟雾的浓度（粒子不透明度），游戏值的倍数；各组自身的值会乘以它。不占用性能。
help.FunnelSmoke/GlobalDensity = 所有舰船烟囱烟雾的粒子数量，游戏值的倍数；各组自身的值会乘以它。粒子越多越耗性能：建议优先使用 GlobalThickness。
help.FunnelSmoke/DieselDensityIdle = 该组在低速时的烟囱烟雾粒子数量，游戏值的倍数。
help.FunnelSmoke/DieselDensityFull = 该组在全功率时的烟囱烟雾粒子数量，游戏值的倍数；两者之间按速度均匀过渡（正在加速的舰船按全功率计）。
help.FunnelSmoke/DieselLightIdle = 该组在低速时的烟囱烟雾明度，%：0 = 黑，100 = 白（中性灰；游戏原有的烟雾是偏褐色的深色）。
help.FunnelSmoke/DieselLightFull = 该组在全速时的烟囱烟雾明度，%：0 = 黑，100 = 白。
help.FunnelSmoke/DieselThicknessIdle = 该组在低速时的烟囱烟雾浓度（看起来有多浓），游戏值的倍数；大于 1 更浓。
help.FunnelSmoke/DieselThicknessFull = 该组在全速时的烟囱烟雾浓度（看起来有多浓），游戏值的倍数；两者之间按速度均匀过渡。
help.FunnelSmoke/DieselLifeIdle = 该组在低速时烟囱烟雾持续多久，游戏值的倍数（粒子的寿命；也会让烟柱变长）。只影响新粒子。
help.FunnelSmoke/DieselLifeFull = 该组在全速时烟囱烟雾持续多久，游戏值的倍数；两者之间按速度均匀过渡。只影响新粒子。
help.FunnelSmoke/SteamDensityIdle = 该组在低速时的烟囱烟雾粒子数量，游戏值的倍数。
help.FunnelSmoke/SteamDensityFull = 该组在全功率时的烟囱烟雾粒子数量，游戏值的倍数；两者之间按速度均匀过渡（正在加速的舰船按全功率计）。
help.FunnelSmoke/SteamLightIdle = 该组在低速时的烟囱烟雾明度，%：0 = 黑，100 = 白（中性灰；游戏原有的烟雾是偏褐色的深色）。
help.FunnelSmoke/SteamLightFull = 该组在全速时的烟囱烟雾明度，%：0 = 黑，100 = 白。
help.FunnelSmoke/SteamThicknessIdle = 该组在低速时的烟囱烟雾浓度（看起来有多浓），游戏值的倍数；大于 1 更浓。
help.FunnelSmoke/SteamThicknessFull = 该组在全速时的烟囱烟雾浓度（看起来有多浓），游戏值的倍数；两者之间按速度均匀过渡。
help.FunnelSmoke/SteamLifeIdle = 该组在低速时烟囱烟雾持续多久，游戏值的倍数（粒子的寿命；也会让烟柱变长）。只影响新粒子。
help.FunnelSmoke/SteamLifeFull = 该组在全速时烟囱烟雾持续多久，游戏值的倍数；两者之间按速度均匀过渡。只影响新粒子。
help.FunnelSmoke/GasTurbineDensityIdle = 该组在低速时的烟囱烟雾粒子数量，游戏值的倍数。
help.FunnelSmoke/GasTurbineDensityFull = 该组在全功率时的烟囱烟雾粒子数量，游戏值的倍数；两者之间按速度均匀过渡（正在加速的舰船按全功率计）。
help.FunnelSmoke/GasTurbineLightIdle = 该组在低速时的烟囱烟雾明度，%：0 = 黑，100 = 白（中性灰；游戏原有的烟雾是偏褐色的深色）。
help.FunnelSmoke/GasTurbineLightFull = 该组在全速时的烟囱烟雾明度，%：0 = 黑，100 = 白。
help.FunnelSmoke/GasTurbineThicknessIdle = 该组在低速时的烟囱烟雾浓度（看起来有多浓），游戏值的倍数；大于 1 更浓。
help.FunnelSmoke/GasTurbineThicknessFull = 该组在全速时的烟囱烟雾浓度（看起来有多浓），游戏值的倍数；两者之间按速度均匀过渡。
help.FunnelSmoke/GasTurbineLifeIdle = 该组在低速时烟囱烟雾持续多久，游戏值的倍数（粒子的寿命；也会让烟柱变长）。只影响新粒子。
help.FunnelSmoke/GasTurbineLifeFull = 该组在全速时烟囱烟雾持续多久，游戏值的倍数；两者之间按速度均匀过渡。只影响新粒子。
