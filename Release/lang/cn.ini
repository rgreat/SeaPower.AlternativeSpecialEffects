help.Effects/SmokeFireShare = 舰船火焰精灵动画：前面一部分（占其长度的 %）含有火焰，保持游戏原有速度；只有其余部分（烟雾）会被 SmokeLifetimeFactor 减慢。
help.Effects/SmokeSpreadGrowth = 舰船火灾烟雾：在粒子寿命被减慢的部分，其精灵会变大，数值为精灵比游戏中飞得更远的程度的 %（0 = 游戏原始大小；100 = 按比例）。
help.Effects/SmokeSpreadFade = 舰船火灾烟雾：变大的精灵会更透明，%（100 = 随尺寸增大不透明度下降；0 = 游戏原有不透明度）。
help.Effects/GunHitEffects = 让炮弹命中更明显、更醒目：每发炮弹按质量归入 10 个等级之一，每个等级各有一套命中舰船、空中、水面和地面的命中效果，以及各自的缩放。关闭 = 使用游戏自带的命中效果。立即生效；已在空中的炮弹保持原有效果。等级在“火炮”页设置。
help.Effects/LifeRaftLights = 救生筏上闪烁的红灯（夜间可见）。关闭 = 救生筏不带灯。立即生效。
help.Effects/BubblesStopMinutes = 舰船开始沉没后经过多少分钟（游戏时间，时间压缩也计入），其沉没气泡效果停止发射（游戏在残骸存在期间永远不会停止）。可在长任务中节省资源。0 = 从不，与游戏一致。
help.UI/HideUnobservedTargets3D = 在 3D 视图中不绘制未被目视观察到的其他阵营目标（仅由雷达、声呐或数据得知）。己方单位始终绘制。F10 菜单中的作弊开关“Show Unidentified”或“Control Enemy Units”开启时不生效。
help.UI/HideUnobservedSubmarines3D = 开启隐藏未观察目标后，潜艇也会被隐藏。关闭：潜艇始终绘制（它们几乎从不被目视看到）。仅在“隐藏在 3D 中看不到的目标”开启时有效。
help.Effects/ColourGradingNoDepthMask = 游戏的色彩分级取决于像素背后的深度；烟雾自身没有深度，所以在地平线处颜色会骤变（海面上方偏褐，天空上方偏灰）。开启：处处使用同一种分级。关闭 = 与游戏一致。
help.Guns/MachineGunBurstFix = 机枪每次射击都显示炮口火焰：仍在播放的池化火焰特效会重新开始。
help.Guns/MachineGunSoundLoopFix = 机枪的循环射击声跳过片段的静音部分（长连发中间的空隙）。
help.Guns/HitSoundFix = 火炮命中始终播放爆炸声：声音未启动的特效（池化实例）被强制播放。
help.General/Debug = 详细日志和 BepInEx/AlternativeWeaponsControl.trace.txt。
help.Debug/CamOffColor = 调试，用于查找是什么改变了地平线处的烟雾颜色：开启时会关闭游戏的这个摄像机效果。不会保存到游戏选项中。
help.Debug/CamOffUnderwater = 调试，用于查找是什么改变了地平线处的烟雾颜色：开启时会关闭游戏的这个摄像机效果。不会保存到游戏选项中。
help.Debug/CamOffOcclusion = 调试，用于查找是什么改变了地平线处的烟雾颜色：开启时会关闭游戏的这个摄像机效果。不会保存到游戏选项中。
help.Debug/CamOffBloom = 调试，用于查找是什么改变了地平线处的烟雾颜色：开启时会关闭游戏的这个摄像机效果。不会保存到游戏选项中。
help.General/Language = 模组文本的语言：游戏语言的代码（en, ru ...）；空 = 游戏自身的语言。文本位于模组文件夹中的 lang/<代码>.ini 文件里 - 编辑即可翻译。
