help.FunnelSmoke/CombinedLightIdle = Luminosidad del humo de chimenea de este grupo a baja velocidad, %: 0 = negro, 100 = blanco (un gris neutro; el humo del juego es oscuro y pardusco).
help.FunnelSmoke/CombinedLightFull = Luminosidad del humo de chimenea de este grupo a toda velocidad, %: 0 = negro, 100 = blanco.
help.FunnelSmoke/CombinedThicknessIdle = Espesor del humo de chimenea de este grupo a baja velocidad (lo denso que parece), × el valor del juego; por encima de 1 lo hace más denso.
help.FunnelSmoke/CombinedThicknessFull = Espesor del humo de chimenea de este grupo a toda velocidad (lo denso que parece), × el valor del juego; entre ambos, de forma uniforme según la velocidad.
help.FunnelSmoke/CombinedLifeIdle = Cuánto dura el humo de chimenea de este grupo a baja velocidad, × el valor del juego (la vida de sus partículas; también alarga la columna). Solo cambian las partículas nuevas.
help.FunnelSmoke/CombinedLifeFull = Cuánto dura el humo de chimenea de este grupo a toda velocidad, × el valor del juego; entre ambos, de forma uniforme según la velocidad. Solo cambian las partículas nuevas.
help.Effects/SmokeFireShare = Animación del sprite del fuego de barcos: la primera parte (% de su longitud) contiene las llamas y conserva la velocidad del juego; solo el resto (humo) se ralentiza con SmokeLifetimeFactor.
help.Effects/SmokeSpreadGrowth = Humo de incendios de barcos: en la parte ralentizada de la vida de una partícula su sprite crece, en % de cuánto más lejos vuelan los sprites que en el juego (0 = el tamaño del juego; 100 = en proporción).
help.Effects/SmokeSpreadFade = Humo de incendios de barcos: los sprites que crecen se vuelven más transparentes, % (100 = la opacidad baja al crecer el tamaño; 0 = la opacidad del juego).
help.Effects/GunHitEffects = Impactos de proyectiles de cañón más visibles y espectaculares: según su masa, cada proyectil recibe una de 10 clases, cada una con su propia colección de efectos de impacto sobre un barco, en el aire, sobre el agua y sobre el suelo, y una escala para cada uno. Desactivado = los efectos de impacto del juego. Surte efecto al instante; un proyectil que ya está en el aire conserva el efecto que tenía. Las clases se fijan en la pestaña Cañones.
help.Effects/LifeRaftLights = Una luz roja intermitente en las balsas salvavidas (visible de noche). Desactivado = balsas sin luces. Surte efecto al instante.
help.Effects/BubblesStopMinutes = Minutos (tiempo de juego, así que cuenta la compresión del tiempo) tras empezar a hundirse un barco, tras los cuales su efecto de burbujas deja de emitir (el juego nunca lo detiene mientras exista el naufragio). Ahorra recursos en misiones largas. 0 = nunca, como en el juego.
help.UI/HideUnobservedTargets3D = No dibuja en la vista 3D los objetivos de otros bandos que no se observan visualmente (conocidos solo por radar, sonar o datos). Tus propias unidades siempre se dibujan. No se aplica mientras estén activos los trucos «Show Unidentified» o «Control Enemy Units» del menú F10.
help.UI/HideUnobservedSubmarines3D = Con el ocultamiento de objetivos no observados activado, los submarinos también se ocultan. Desactivado: los submarinos siempre se dibujan (casi nunca se ven visualmente). Solo cuenta si «Ocultar objetivos que no se ven en 3D» está activado.
help.Effects/ColourGradingNoDepthMask = La gradación de color del juego depende de la profundidad detrás de un píxel; el humo no tiene profundidad propia, por lo que cambiaba bruscamente de color en el horizonte (marrón sobre el mar, gris sobre el cielo). Activado: la misma gradación en todas partes. Desactivado = como en el juego.
help.Guns/MachineGunBurstFix = Las ametralladoras muestran su fogonazo en cada disparo: un efecto de fogonazo del grupo que aún se reproduce se reinicia.
help.Guns/MachineGunSoundLoopFix = El sonido de disparo en bucle de las ametralladoras omite la parte silenciosa de su clip (un hueco en medio de una ráfaga larga).
help.Guns/HitSoundFix = Los impactos de cañón siempre reproducen su sonido de explosión: a un efecto cuyo sonido no se inició (instancia del grupo) se le fuerza a reproducirlo.
help.General/Debug = Registro detallado y BepInEx/AlternativeWeaponsControl.trace.txt.
help.Debug/CamOffColor = Depuración para averiguar qué cambia el color del humo en el horizonte: desactiva este efecto de cámara del juego mientras está activado. No se guarda en las opciones del juego.
help.Debug/CamOffUnderwater = Depuración para averiguar qué cambia el color del humo en el horizonte: desactiva este efecto de cámara del juego mientras está activado. No se guarda en las opciones del juego.
help.Debug/CamOffOcclusion = Depuración para averiguar qué cambia el color del humo en el horizonte: desactiva este efecto de cámara del juego mientras está activado. No se guarda en las opciones del juego.
help.Debug/CamOffBloom = Depuración para averiguar qué cambia el color del humo en el horizonte: desactiva este efecto de cámara del juego mientras está activado. No se guarda en las opciones del juego.
help.General/Language = Idioma de los textos del mod: un código de idioma del juego (en, ru ...); vacío = el idioma propio del juego. Los textos están en los archivos lang/<código>.ini de la carpeta del mod - edítelos para traducir.
