help.Effects/SmokeAfterClouds = El humo (de incendios y chimeneas) y las nubes se superponen en el orden correcto: antes de cada fotograma, cada columna de humo se coloca delante o detrás de las nubes según dónde esté la capa de nubes en la línea de la cámara a ella (el juego ordena una celda de nubes entera, de kilómetros de ancho, por su centro, así que las nubes detrás de un barco podían tapar su humo). Desactivado = como en el juego.
lbl.Effects/SmokeKeepOnStop = Conservar el humo vivo al cambiar la fase del fuego
help.Effects/SmokeKeepOnStop = Cuando un fuego cambia de fase o se apaga, el humo que ya está en el aire permanece y se desvanece; solo se detienen las partículas nuevas. Desactivado = el juego lo borra al instante.
