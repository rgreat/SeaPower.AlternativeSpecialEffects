unit.x = x
help.Effects/FireFlicker = La luz de un incendio en un barco parpadea, más profunda y rápida cuanto más fuerte es el incendio (pequeño / moderado / grave).
help.Effects/FireLightPower = Brillo de la luz de los incendios en los barcos (la luz de incendio del juego, multiplicada; su alcance también crece). 1 = la del juego.
help.Effects/MuzzleFlashLight = Un breve destello de luz en la boca cuando disparan cañones, CIWS y ametralladoras (visible de noche).
help.Effects/MissileLaunchFlashLight = Una luz acompaña al misil mientras arde su propulsor tras el lanzamiento (el tiempo de combustión del propulsor del misil).
help.Effects/HitFlashLight = Un breve destello de luz donde impacta un proyectil (no en el agua).
help.Effects/DayBrightness = Brillo de los destellos y de la luz del fuego de día, 1 = sin atenuar. Con sol pleno las luces se multiplican por este valor (de noche no cambian): el sol y una luz intensa se suman y se queman en blanco y rosa.
help.Effects/FlashPower = Brillo y tamaño de los destellos, 1 = predeterminado.
help.Effects/FlashLimit = Los cañones, CIWS y ametralladoras del jugador giran y se elevan hacia un objetivo más allá de su alcance máximo (hasta 1,5 x el alcance, al menos 5 mn) sin disparar, como si estuviera al alcance máximo. Desactivado = como en el juego: la torreta permanece quieta hasta que el objetivo está en alcance.
help.Effects/ExtraSmokeEmitters = Número de puntos de fuego y humo según la eslora en lugar de los tres del juego: menos de 25 m 1, menos de 50 m 2, menos de 75 m 3, desde 75 m 5 (uno por sección, cada uno muestra el fuego de su sección). Para los barcos que aparezcan a partir de ahora.
help.Effects/SmokeBySeverity = El aspecto del fuego depende de su intensidad (proporción de su máximo) en lugar de las fases del juego: pequeño, moderado desde SmokeModerateFrom, grave desde SmokeSevereFrom (el juego: 25 % / 50 %); el humo del fuego pequeño crece de SmokeStartOpacity a SmokeEndOpacity. Solo el aspecto: el daño y la propagación siguen siendo los del juego. Desactivado = como en el juego.
help.Effects/SmokeStartOpacity = Fuego pequeño: opacidad del humo de las partículas nuevas al 0 % del máximo del fuego, % del valor del juego.
help.Effects/SmokeEndOpacity = Fuego pequeño: opacidad del humo de las partículas nuevas en SmokeModerateFrom, % del valor del juego; entre ambos, de forma uniforme según la intensidad del fuego.
help.Effects/SmokeModerateFrom = El aspecto del fuego moderado desde esta intensidad, % del máximo del fuego (el juego: 25 %).
help.Effects/SmokeSevereFrom = El aspecto del fuego grave desde esta intensidad, % del máximo del fuego (el juego: 50 %).
help.Effects/SmokeSortFix = Las columnas de humo de un mismo barco se superponen en el orden correcto: cada sistema de humo se ordena por la distancia a su punto de fuego, no al centro de sus límites (el centro de una columna alta está muy arriba). Desactivado = como en el juego.
help.Effects/SmokeDensityFactor = Densidad del fuego y el humo de los barcos: el número de partículas que emiten se multiplica por este valor (1 = como en el juego; por defecto 2). No cambia nada más.
help.Effects/SmokeLifetimeFactor = El humo de los incendios de barcos dura tantas veces más antes de disiparse (1 = como en el juego).
help.FunnelSmoke/Enabled = El humo de chimenea de los barcos sigue el tipo de motor y la carga: su densidad, luminosidad y espesor los fijan los grupos de abajo (Diesel, Steam, GasTurbine, Nuclear, Combined). El grupo de un barco es su sistema de propulsión en uso; funnel_groups.txt (junto a la dll) fuerza a un barco a otro grupo. Desactivado = como en el juego.
help.FunnelSmoke/GlobalThickness = Espesor (opacidad de las partículas) del humo de chimenea de todos los barcos, × el valor del juego; los valores propios de los grupos se multiplican por este. No cuesta rendimiento.
help.FunnelSmoke/GlobalDensity = Número de partículas de humo de chimenea de todos los barcos, × el valor del juego; los valores propios de los grupos se multiplican por este. Más partículas cuestan rendimiento: es preferible usar GlobalThickness.
help.FunnelSmoke/DieselDensityIdle = Cantidad de partículas de humo de chimenea de este grupo a baja velocidad, × el valor del juego.
help.FunnelSmoke/DieselDensityFull = Cantidad de partículas de humo de chimenea de este grupo a plena potencia, × el valor del juego; entre ambos, de forma uniforme según la velocidad (un barco que acelera cuenta como a plena potencia).
help.FunnelSmoke/DieselLightIdle = Luminosidad del humo de chimenea de este grupo a baja velocidad, %: 0 = negro, 100 = blanco (un gris neutro; el humo del juego es oscuro y pardusco).
help.FunnelSmoke/DieselLightFull = Luminosidad del humo de chimenea de este grupo a toda velocidad, %: 0 = negro, 100 = blanco.
help.FunnelSmoke/DieselThicknessIdle = Espesor del humo de chimenea de este grupo a baja velocidad (lo denso que parece), × el valor del juego; por encima de 1 lo hace más denso.
help.FunnelSmoke/DieselThicknessFull = Espesor del humo de chimenea de este grupo a toda velocidad (lo denso que parece), × el valor del juego; entre ambos, de forma uniforme según la velocidad.
help.FunnelSmoke/DieselLifeIdle = Cuánto dura el humo de chimenea de este grupo a baja velocidad, × el valor del juego (la vida de sus partículas; también alarga la columna). Solo cambian las partículas nuevas.
help.FunnelSmoke/DieselLifeFull = Cuánto dura el humo de chimenea de este grupo a toda velocidad, × el valor del juego; entre ambos, de forma uniforme según la velocidad. Solo cambian las partículas nuevas.
help.FunnelSmoke/SteamDensityIdle = Cantidad de partículas de humo de chimenea de este grupo a baja velocidad, × el valor del juego.
help.FunnelSmoke/SteamDensityFull = Cantidad de partículas de humo de chimenea de este grupo a plena potencia, × el valor del juego; entre ambos, de forma uniforme según la velocidad (un barco que acelera cuenta como a plena potencia).
help.FunnelSmoke/SteamLightIdle = Luminosidad del humo de chimenea de este grupo a baja velocidad, %: 0 = negro, 100 = blanco (un gris neutro; el humo del juego es oscuro y pardusco).
help.FunnelSmoke/SteamLightFull = Luminosidad del humo de chimenea de este grupo a toda velocidad, %: 0 = negro, 100 = blanco.
