help.FunnelSmoke/SteamThicknessFull = Espesor del humo de chimenea de este grupo a toda velocidad (lo denso que parece), × el valor del juego; entre ambos, de forma uniforme según la velocidad.
help.FunnelSmoke/SteamLifeIdle = Cuánto dura el humo de chimenea de este grupo a baja velocidad, × el valor del juego (la vida de sus partículas; también alarga la columna). Solo cambian las partículas nuevas.
help.FunnelSmoke/SteamLifeFull = Cuánto dura el humo de chimenea de este grupo a toda velocidad, × el valor del juego; entre ambos, de forma uniforme según la velocidad. Solo cambian las partículas nuevas.
