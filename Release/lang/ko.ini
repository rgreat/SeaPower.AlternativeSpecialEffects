help.FunnelSmoke/CombinedLifeFull = 전속 시 이 그룹의 굴뚝 연기가 지속되는 시간, 게임 값의 배수. 그 사이는 속도에 따라 균등하게 변합니다. 새 입자만 바뀝니다.
help.Effects/SmokeFireShare = 함선 화재 스프라이트 애니메이션: 앞부분(길이의 %)에는 불꽃이 들어 있어 게임 속도를 유지하고, 나머지(연기)만 SmokeLifetimeFactor로 느려집니다.
help.Effects/SmokeSpreadGrowth = 함선 화재 연기: 입자 수명 중 느려진 구간에서 스프라이트가 커집니다. 스프라이트가 게임보다 얼마나 더 멀리 날아가는지의 %입니다(0 = 게임 기본 크기, 100 = 비례).
help.Effects/SmokeSpreadFade = 함선 화재 연기: 커지는 스프라이트가 더 투명해집니다(%). 100 = 크기가 커질수록 불투명도가 낮아짐, 0 = 게임 기본 불투명도.
help.Effects/GunHitEffects = 포탄 명중을 더 잘 보이고 화려하게 만듭니다. 질량에 따라 각 포탄이 10개 등급 중 하나로 분류되며, 등급마다 함선·공중·수면·지면에 대한 명중 효과 모음과 각각의 배율이 있습니다. 끄면 게임 기본 명중 효과입니다. 즉시 적용되며 이미 공중에 있는 포탄은 기존 효과를 유지합니다. 등급은 '포' 탭에서 설정합니다.
help.Effects/LifeRaftLights = 구명뗏목에 깜박이는 붉은 조명(밤에 보임). 끄면 조명이 없습니다. 즉시 적용됩니다.
help.Effects/BubblesStopMinutes = 함선이 침몰하기 시작한 뒤 침몰 기포 효과가 방출을 멈추기까지의 분 단위 시간(게임 내 시간이므로 시간 압축도 반영됨. 게임은 잔해가 있는 동안 멈추지 않습니다). 긴 임무에서 자원을 절약합니다. 0 = 안 함(게임과 동일).
help.UI/HideUnobservedTargets3D = 3D 보기에서 육안으로 관측되지 않는 다른 진영의 목표(레이더, 소나 또는 데이터로만 파악)를 그리지 않습니다. 아군 유닛은 항상 그려집니다. F10 메뉴의 치트 스위치 'Show Unidentified' 또는 'Control Enemy Units'가 켜져 있는 동안은 적용되지 않습니다.
help.UI/HideUnobservedSubmarines3D = 미관측 목표 숨기기가 켜져 있으면 잠수함도 숨겨집니다. 끄면 잠수함은 항상 그려집니다(육안으로 보이는 일은 거의 없으므로). '3D에서 보이지 않는 목표 숨기기'가 켜져 있을 때만 적용됩니다.
help.Effects/ColourGradingNoDepthMask = 게임의 색 보정은 픽셀 뒤의 깊이에 따라 달라집니다. 연기에는 자체 깊이가 없어 수평선에서 색이 급격히 바뀌었습니다(바다 위는 갈색, 하늘 위는 회색). 켜면 어디서나 같은 보정을 사용합니다. 끄면 게임과 동일합니다.
help.Guns/MachineGunBurstFix = 기관총은 매 발사마다 총구 섬광을 표시합니다: 아직 재생 중인 풀링된 섬광 효과를 다시 시작합니다.
help.Guns/MachineGunSoundLoopFix = 기관총의 반복 발사음은 클립의 무음 부분(긴 연사 중간의 틈)을 건너뜁니다.
help.Guns/HitSoundFix = 함포 명중은 항상 폭발음을 재생합니다: 소리가 시작되지 않은 효과(풀링된 인스턴스)를 재생하도록 만듭니다.
help.General/Debug = 상세 로그 및 BepInEx/AlternativeWeaponsControl.trace.txt.
help.Debug/CamOffColor = 수평선에서 연기 색을 바꾸는 요인을 찾기 위한 디버그: 켜져 있는 동안 게임의 이 카메라 효과를 끕니다. 게임 옵션에는 저장되지 않습니다.
help.Debug/CamOffUnderwater = 수평선에서 연기 색을 바꾸는 요인을 찾기 위한 디버그: 켜져 있는 동안 게임의 이 카메라 효과를 끕니다. 게임 옵션에는 저장되지 않습니다.
help.Debug/CamOffOcclusion = 수평선에서 연기 색을 바꾸는 요인을 찾기 위한 디버그: 켜져 있는 동안 게임의 이 카메라 효과를 끕니다. 게임 옵션에는 저장되지 않습니다.
help.Debug/CamOffBloom = 수평선에서 연기 색을 바꾸는 요인을 찾기 위한 디버그: 켜져 있는 동안 게임의 이 카메라 효과를 끕니다. 게임 옵션에는 저장되지 않습니다.
help.General/Language = 모드 텍스트의 언어: 게임 언어 코드(en, ru ...); 비어 있음 = 게임 자체의 언어. 텍스트는 모드 폴더의 lang/<코드>.ini 파일에 있으며, 편집하여 번역할 수 있습니다.
