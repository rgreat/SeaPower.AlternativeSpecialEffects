help.Effects/SmokeAfterClouds = 연기(화재와 굴뚝)와 구름이 올바른 순서로 겹칩니다. 매 프레임 전에 카메라에서 연기 기둥으로 이어지는 선 위에서 구름층의 위치에 따라 각 연기 기둥을 구름 앞 또는 뒤에 배치합니다(게임은 폭 수 km의 구름 셀 전체를 중심점으로 정렬하므로 함선 뒤의 구름이 그 연기를 가릴 수 있었습니다). 끄면 게임과 동일합니다.
