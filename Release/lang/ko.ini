unit.x = x
help.Effects/FireFlicker = 함정의 화재 불빛이 깜박이며, 화재가 강할수록 더 깊고 빠릅니다(작음 / 보통 / 심각).
help.Effects/FireLightPower = 함정의 화재 불빛 밝기(게임 자체의 화재 불빛에 배율 적용; 범위도 커짐). 1 = 게임과 동일.
help.Effects/MuzzleFlashLight = 함포, CIWS, 기관총 발사 시 총구의 짧은 섬광(밤에 보임).
help.Effects/MissileLaunchFlashLight = 발사 후 부스터가 타는 동안 미사일을 따라다니는 불빛(미사일의 부스터 연소 시간).
help.Effects/HitFlashLight = 포탄이 명중한 곳의 짧은 섬광(물 속 제외).
help.Effects/DayBrightness = 낮 동안 섬광과 화재 불빛의 밝기, 1 = 줄이지 않음. 한낮에는 불빛에 이 값이 곱해집니다(밤에는 변함 없음). 햇빛과 강한 빛이 겹쳐 흰색과 분홍색으로 날아가는 것을 막습니다.
help.Effects/FlashPower = 섬광의 밝기와 크기, 1 = 기본값.
help.Effects/FlashLimit = 플레이어의 함포, CIWS, 기관총이 최대 사거리 밖의 목표(사거리의 최대 1.5배, 최소 5해리)를 향해 사격 없이 회전하고 앙각을 잡습니다. 최대 사거리에 있는 것처럼. 꺼짐 = 게임과 동일: 목표가 사거리에 들어올 때까지 포탑은 움직이지 않습니다.
help.Effects/ExtraSmokeEmitters = 게임의 3개 대신 함선 길이에 따라 정하는 화재·연기 지점 수: 25 m 미만 1개, 50 m 미만 2개, 75 m 미만 3개, 75 m 이상 5개(구획마다 하나이며 각각 자기 구획의 화재를 표시). 지금부터 생성되는 함선에 적용됩니다.
help.Effects/SmokeBySeverity = 게임의 단계 대신 화재의 강도(최댓값 대비 비율)에 따라 화재 모양을 정합니다: 작음, SmokeModerateFrom부터 중간, SmokeSevereFrom부터 심각(게임: 25% / 50%). 작은 불의 연기는 SmokeStartOpacity에서 SmokeEndOpacity까지 늘어납니다. 모양만 바뀌며 피해와 확산은 게임 그대로입니다. 끄면 게임과 동일합니다.
help.Effects/SmokeStartOpacity = 작은 불: 화재가 최댓값의 0%일 때 새 입자의 연기 불투명도(게임 값의 %).
help.Effects/SmokeEndOpacity = 작은 불: 화재가 SmokeModerateFrom일 때 새 입자의 연기 불투명도(게임 값의 %). 그 사이는 화재 강도에 따라 균등하게 변합니다.
help.Effects/SmokeModerateFrom = 이 강도부터 중간 화재 모양이 적용됩니다(화재 최댓값의 %, 게임: 25%).
help.Effects/SmokeSevereFrom = 이 강도부터 심각한 화재 모양이 적용됩니다(화재 최댓값의 %, 게임: 50%).
help.Effects/SmokeSortFix = 한 함선의 연기 기둥이 올바른 순서로 겹칩니다. 각 연기 시스템을 경계 중심이 아니라 발화 지점까지의 거리로 정렬합니다(높은 연기 기둥의 중심은 높은 곳에 있기 때문). 끄면 게임과 동일합니다.
help.Effects/SmokeDensityFactor = 함선 화재와 연기의 밀도: 방출되는 입자 수에 이 값을 곱합니다(1 = 게임과 동일, 기본값 2). 그 외에는 바뀌지 않습니다.
help.Effects/SmokeLifetimeFactor = 함선 화재 연기가 옅어지기 전까지 이 배수만큼 더 오래 지속됩니다(1 = 게임과 동일).
help.FunnelSmoke/Enabled = 함선의 굴뚝 연기는 엔진 종류와 부하에 따라 달라집니다. 밀도, 밝기, 농도는 아래 그룹(Diesel, Steam, GasTurbine, Nuclear, Combined)에서 정합니다. 함선의 그룹은 사용 중인 동력 시스템이며, funnel_groups.txt(dll 옆)로 함선을 다른 그룹에 강제로 넣을 수 있습니다. 끄면 게임과 동일합니다.
help.FunnelSmoke/GlobalThickness = 모든 함선의 굴뚝 연기 농도(입자 불투명도), 게임 값의 배수. 각 그룹의 값에 이 값이 곱해집니다. 성능 비용이 없습니다.
help.FunnelSmoke/GlobalDensity = 모든 함선의 굴뚝 연기 입자 수, 게임 값의 배수. 각 그룹의 값에 이 값이 곱해집니다. 입자가 많을수록 성능이 떨어지므로 GlobalThickness를 우선 사용하세요.
help.FunnelSmoke/DieselDensityIdle = 저속 시 이 그룹의 굴뚝 연기 입자 양, 게임 값의 배수.
help.FunnelSmoke/DieselDensityFull = 최대 출력 시 이 그룹의 굴뚝 연기 입자 양, 게임 값의 배수. 그 사이는 속도에 따라 균등하게 변합니다(가속 중인 함선은 최대 출력으로 간주).
help.FunnelSmoke/DieselLightIdle = 저속 시 이 그룹의 굴뚝 연기 밝기(%): 0 = 검정, 100 = 흰색(중립 회색. 게임의 연기는 갈색기 도는 어두운 색입니다).
help.FunnelSmoke/DieselLightFull = 전속 시 이 그룹의 굴뚝 연기 밝기(%): 0 = 검정, 100 = 흰색.
help.FunnelSmoke/DieselThicknessIdle = 저속 시 이 그룹의 굴뚝 연기 농도(얼마나 짙어 보이는지), 게임 값의 배수. 1보다 크면 더 짙어집니다.
help.FunnelSmoke/DieselThicknessFull = 전속 시 이 그룹의 굴뚝 연기 농도(얼마나 짙어 보이는지), 게임 값의 배수. 그 사이는 속도에 따라 균등하게 변합니다.
help.FunnelSmoke/DieselLifeIdle = 저속 시 이 그룹의 굴뚝 연기가 지속되는 시간, 게임 값의 배수(입자의 수명이며 연기 기둥도 길어집니다). 새 입자만 바뀝니다.
help.FunnelSmoke/DieselLifeFull = 전속 시 이 그룹의 굴뚝 연기가 지속되는 시간, 게임 값의 배수. 그 사이는 속도에 따라 균등하게 변합니다. 새 입자만 바뀝니다.
